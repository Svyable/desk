<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Deletion barycenter and convex amplification</title>
  <desc id="desc">The parent local-profile vector is the barycenter of one-vertex deletion profiles. A convex potential must be at least as large at one child as at the parent.</desc>
  <rect width="980" height="420" fill="white"/>
  <style>
    .axis { stroke:#777; stroke-width:1.2; }
    .edge { stroke:#555; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .child { fill:#f6f6f6; stroke:#111; stroke-width:1.5; }
    .parent { fill:#111; stroke:#111; stroke-width:1.5; }
    .label { font: 16px sans-serif; fill:#111; }
    .small { font: 14px sans-serif; fill:#444; }
    .eq { font: 19px serif; fill:#111; }
    .contour { fill:none; stroke:#aaa; stroke-width:1.2; stroke-dasharray:5 5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <text x="45" y="38" class="label">One deletion step in profile space</text>
  <line x1="75" y1="330" x2="450" y2="330" class="axis"/>
  <line x1="75" y1="330" x2="75" y2="70" class="axis"/>
  <text x="430" y="355" class="small">coordinate 1</text>
  <text x="20" y="80" class="small" transform="rotate(-90 20 80)">coordinate 2</text>

  <circle cx="145" cy="125" r="9" class="child"/>
  <circle cx="185" cy="285" r="9" class="child"/>
  <circle cx="315" cy="105" r="9" class="child"/>
  <circle cx="395" cy="250" r="9" class="child"/>
  <circle cx="260" cy="192" r="9" class="parent"/>

  <line x1="260" y1="192" x2="151" y2="131" class="edge"/>
  <line x1="260" y1="192" x2="191" y2="279" class="edge"/>
  <line x1="260" y1="192" x2="309" y2="111" class="edge"/>
  <line x1="260" y1="192" x2="389" y2="244" class="edge"/>

  <text x="276" y="190" class="small">U(S)</text>
  <text x="112" y="112" class="small">U(S−v₁)</text>
  <text x="137" y="310" class="small">U(S−v₂)</text>
  <text x="300" y="84" class="small">U(S−v₃)</text>
  <text x="397" y="276" class="small">U(S−v₄)</text>
  <text x="105" y="385" class="eq">U(S) = average of all U(S−v)</text>

  <text x="555" y="38" class="label">Convexity selects an amplifying child</text>
  <ellipse cx="740" cy="205" rx="82" ry="52" class="contour"/>
  <ellipse cx="740" cy="205" rx="135" ry="88" class="contour"/>
  <ellipse cx="740" cy="205" rx="190" ry="125" class="contour"/>
  <circle cx="740" cy="205" r="9" class="parent"/>
  <circle cx="610" cy="126" r="9" class="child"/>
  <circle cx="855" cy="105" r="9" class="child"/>
  <circle cx="895" cy="275" r="9" class="child"/>
  <circle cx="665" cy="295" r="9" class="child"/>
  <line x1="740" y1="205" x2="848" y2="111" class="edge"/>
  <text x="755" y="200" class="small">parent</text>
  <text x="828" y="82" class="small">chosen child</text>
  <text x="585" y="365" class="eq">Φ(child) ≥ Φ(parent) for some deletion</text>
</svg>
