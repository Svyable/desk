<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Greedy KL-amplifying deletion chain</title>
  <desc id="desc">A deterministic 14-vertex graph is greedily reduced to five vertices. KL divergence of the three-vertex induced-pattern law from G(3, one half) increases at every step.</desc>
  <rect width="900" height="480" fill="white"/>
  <text x="450" y="25" text-anchor="middle" font-family="sans-serif" font-size="18">Greedy KL-amplifying deletion chain</text>
  <line x1="85" y1="410" x2="865" y2="410" stroke="black"/>
  <line x1="85" y1="45" x2="85" y2="410" stroke="black"/>
  <polyline points="865,402.5 778.3,389.7 691.7,369.9 605,347.7 518.3,314.6 431.7,267.3 345,231.5 258.3,220.3 171.7,189.1 85,72" fill="none" stroke="black" stroke-width="2"/>
  <g fill="white" stroke="black" stroke-width="1.5">
    <circle cx="865" cy="402.5" r="4.5"/><circle cx="778.3" cy="389.7" r="4.5"/>
    <circle cx="691.7" cy="369.9" r="4.5"/><circle cx="605" cy="347.7" r="4.5"/>
    <circle cx="518.3" cy="314.6" r="4.5"/><circle cx="431.7" cy="267.3" r="4.5"/>
    <circle cx="345" cy="231.5" r="4.5"/><circle cx="258.3" cy="220.3" r="4.5"/>
    <circle cx="171.7" cy="189.1" r="4.5"/><circle cx="85" cy="72" r="4.5"/>
  </g>
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <text x="865" y="388">0.046</text><text x="778.3" y="375">0.125</text>
    <text x="691.7" y="355">0.246</text><text x="605" y="333">0.383</text>
    <text x="518.3" y="300">0.587</text><text x="431.7" y="253">0.878</text>
    <text x="345" y="217">1.098</text><text x="258.3" y="206">1.167</text>
    <text x="171.7" y="175">1.359</text><text x="85" y="58">2.079</text>
  </g>
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <text x="865" y="430">14</text><text x="778.3" y="430">13</text><text x="691.7" y="430">12</text>
    <text x="605" y="430">11</text><text x="518.3" y="430">10</text><text x="431.7" y="430">9</text>
    <text x="345" y="430">8</text><text x="258.3" y="430">7</text><text x="171.7" y="430">6</text><text x="85" y="430">5</text>
  </g>
  <text x="450" y="465" text-anchor="middle" font-family="sans-serif" font-size="14">remaining vertices (chain runs right to left)</text>
  <text x="20" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" transform="rotate(-90 20 240)">KL divergence from G(3, 1/2)</text>
</svg>
