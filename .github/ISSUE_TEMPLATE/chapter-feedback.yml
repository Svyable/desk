name: Chapter feedback
description: Suggest an improvement to a chapter — no git knowledge needed
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reading. Tell us which part and what you would change.
        If you know the exact line, you can also open a pull request and
        propose the new sentence there.
  - type: dropdown
    id: book
    attributes:
      label: Book
      description: Which book is this about?
      options:
        - abdicating-intelligence
        - adaptation-debt
        - adjacency
        - agentile
        - aggregate-consolidate-innovate
        - allocating-intelligence
        - americas-got-a-spending-problem
        - appeal
        - artificial-abundance
        - artificial-identity
        - artificial-promises
        - asleep-at-the-wheel
        - austerity-measures
        - bookself
        - chiptastrophy
        - chokepoint
        - commit
        - democraicy
        - energy-value-intelligence
        - exponential-compression
        - face-the-strange
        - fiscal-wall
        - gatekeepers
        - gradient-ascent
        - intelligence-state
        - keep-cooking
        - leveraging-luck
        - look-alive
        - make-yourself-useful
        - neuralase
        - no-one-read-it
        - nothing-counts-yet
        - open-source
        - orbital
        - pace-of-change
        - predictable
        - proof-of-human
        - public-pressure
        - restructuring-america
        - right-to-try
        - robust
        - running-on-full
        - scaling-laws
        - second-guess
        - shannons-demon
        - silent-cartel
        - single-points-of-failure
        - solar-century
        - source-code
        - subsidized-intelligence
        - synthetic-intelligence
        - the-abstraction-trap
        - the-agentic-consumer-economy
        - the-alliance-advantage
        - the-bureaucracy-of-heaven
        - the-cancer-key
        - the-collective
        - the-compatibility-dividend
        - the-convergence
        - the-delegation-machine
        - the-delete-key
        - the-deletion-economy
        - the-expiration-machine
        - the-exponentiality
        - the-half-life-of-now
        - the-hundred-year-career
        - the-hundred-year-handoff
        - the-hunger-switch
        - the-intelligence-bubble
        - the-intelligence-dilemma
        - the-last-human-channel
        - the-loneliness-dividend
        - the-long-running-mind
        - the-longevity-moment
        - the-measure-of-good
        - the-mortality-discount
        - the-never-ending-intelligence
        - the-orphan-age
        - the-potentiality
        - the-reliability-tax
        - the-retry-generation
        - the-risk-pool
        - the-search-frontier
        - the-second-order
        - the-swarm-agents-in-the-wild
        - the-taiwan-threshold
        - the-ten-year-republic
        - the-unbounding
        - the-unobserved-world
        - the-value-stack
        - the-vanishing-bid
        - the-waiting-list
        - the-warning-problem
        - the-weather-we-build
        - the-world-beneath-the-world
        - the-world-wont-choose-sides
        - this-tech-is-different
        - to-state-the-obvious
        - traces
        - triumph-of-the-commons
        - ubiquitous
        - useful-noise
        - vectors
        - vibecariously
        - wild-speculation
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where in the book?
      description: Chapter name, or a few words from the passage.
      placeholder: e.g. Chapter 2, the paragraph starting with…
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback?
      options:
        - Typo
        - Clarity
        - Structure
        - Bigger idea
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What would you change, and why?
    validations:
      required: true
