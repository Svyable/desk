name: Temporary publication validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'repair/imenent-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/imenent-catalog
          fetch-depth: 0
      - name: Regenerate canonical Desk catalog
        run: python3 scripts/catalog.py --write
      - name: Commit deterministic regeneration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md catalog.json .github/ISSUE_TEMPLATE/chapter-feedback.yml llms.txt sitemap.xml index.html 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Desk discovery after Imenent registration"
            git push origin HEAD:repair/imenent-catalog
          fi
      - name: Validate Desk integrity
        continue-on-error: true
        run: python3 scripts/check-desk.py
      - name: Validate Renegade Code length
        continue-on-error: true
        run: python3 scripts/check-book-length.py renegade-code --json
