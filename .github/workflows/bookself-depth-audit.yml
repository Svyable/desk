name: Temporary Bookself depth audit

on:
  push:
    branches:
      - revision/bookself-depth-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report Bookself chapter word counts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          word_re = re.compile(r"\b[\w’'-]+\b", re.UNICODE)
          root = Path('books/bookself/manuscript')
          print('BOOKSELF_CHAPTER_WORD_COUNTS')
          for path in sorted(root.glob('ch*.md')):
              count = len(word_re.findall(path.read_text(encoding='utf-8')))
              print(f'{path.name}\t{count}')
          total = sum(len(word_re.findall(path.read_text(encoding='utf-8'))) for path in root.rglob('*.md'))
          print(f'TOTAL_ALL_MANUSCRIPT_MD\t{total}')
          PY
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/bookself-depth-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/bookself-depth-audit.yml
          git commit -m "Remove temporary Bookself depth audit"
          git push
