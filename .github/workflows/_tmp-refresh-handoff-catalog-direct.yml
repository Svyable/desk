name: Temporary direct Handoff catalog refresh

on:
  push:
    branches:
      - refresh/hundred-year-handoff-catalog-direct

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate from latest main and fast-forward safely
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt"
            git fetch origin main
            git checkout -B catalog-refresh origin/main

            set +e
            python3 scripts/catalog.py --write
            catalog_status=$?
            set -e
            echo "catalog.py exit status: $catalog_status"

            git add -A
            if git diff --cached --quiet; then
              echo "Catalog already current"
              exit 0
            fi

            git commit -m "Refresh Desk catalog after Hundred-Year Handoff update"
            if git push origin HEAD:main; then
              echo "Catalog refresh landed on main"
              exit 0
            fi

            echo "main advanced; regenerating from latest tip"
          done

          echo "Could not fast-forward catalog refresh after bounded retries"
          exit 1
