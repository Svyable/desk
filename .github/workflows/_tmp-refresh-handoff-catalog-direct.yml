name: Temporary sibling-aware Handoff catalog refresh

on:
  push:
    branches:
      - refresh/hundred-year-handoff-catalog-direct

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desk trigger branch
        uses: actions/checkout@v4
        with:
          path: trigger
          fetch-depth: 1
      - name: Checkout Desk main working copy
        uses: actions/checkout@v4
        with:
          repository: Svyable/desk
          ref: main
          path: desk
          fetch-depth: 0
      - name: Checkout Shelf main
        uses: actions/checkout@v4
        with:
          repository: Svyable/shelf
          ref: main
          path: shelf
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate Desk and Shelf metadata from latest tips
        shell: bash
        run: |
          set -u
          cd desk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt"
            git fetch origin main
            git checkout -B catalog-refresh origin/main
            git -C ../shelf fetch origin main
            git -C ../shelf checkout -B main origin/main

            set +e
            python3 scripts/catalog.py --write --shelf-root ../shelf
            catalog_status=$?
            set -e
            echo "catalog.py exit status: $catalog_status"

            git add -A
            if git diff --cached --quiet; then
              echo "Catalog already current"
              exit 0
            fi

            git commit -m "Refresh Desk and Shelf metadata after Hundred-Year Handoff proof"
            if git push origin HEAD:main; then
              echo "Sibling-aware catalog refresh landed on main"
              exit 0
            fi

            echo "main advanced; regenerating from latest Desk and Shelf tips"
          done

          echo "Could not fast-forward sibling-aware refresh after bounded retries"
          exit 1
