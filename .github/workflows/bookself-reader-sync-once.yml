name: One-shot Bookself Reader safe sync

on:
  push:
    branches:
      - sync/bookself-reader-runtime-20260914

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Desk
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out pinned Bookself
        uses: actions/checkout@v4
        with:
          repository: Svyable/bookself
          ref: 693013fee01e3ffec6c7199502a587d691891c88
          path: .bookself
      - name: Verify upstream sync policy
        run: python3 .bookself/tests/test_sync_ui.py
      - name: Safe-sync Bookself Reader runtime
        run: python3 .bookself/scripts/sync-ui.py --desk-safe "$GITHUB_WORKSPACE"
      - name: Verify Reader regression contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "bookself-reader-shell-v109" reader/sw.js
          grep -q "CACHE_PREFIX = 'bookself-reader-shell-'" reader/sw.js
          grep -q "DOMContentLoaded" reader/js/experience.js
          ! grep -Fq "window.addEventListener('load', () => waitForImprint()" reader/js/experience.js
          grep -q "installFirstReadLayoutSettlement" reader/js/viewport-stability-runtime.js
          grep -Fq "document.fonts?.ready" reader/js/viewport-stability-runtime.js
          grep -Fq "aria-modal') !== 'false'" reader/js/viewport-stability-runtime.js
          grep -Fq "attributeFilter: ['class']" reader/js/viewport-stability-runtime.js
          ! grep -Fq "attributeFilter: ['class', 'aria-modal']" reader/js/viewport-stability-runtime.js
          ! grep -R -Fq "https://svyable.github.io/bookself/reader/" reader
          test -s reader/.bookself-runtime-files
          test -s reader/.bookself-offline-version
          cp reader/js/app-loader.js /tmp/desk-app-loader.mjs
          cp reader/js/viewport-stability-runtime.js /tmp/desk-viewport-stability-runtime.mjs
          cp reader/js/experience.js /tmp/desk-experience.mjs
          node --check /tmp/desk-app-loader.mjs
          node --check /tmp/desk-viewport-stability-runtime.mjs
          node --check /tmp/desk-experience.mjs
          git diff --exit-code "$GITHUB_SHA" -- imprint.json books scripts
      - name: Commit synchronized Reader
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader
          if git diff --cached --quiet; then
            echo "Reader already synchronized"
            exit 0
          fi
          git commit -m "Sync Bookself Reader runtime"
          git push origin HEAD:sync/bookself-reader-runtime-20260914
