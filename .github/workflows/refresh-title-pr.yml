name: Refresh title PR from main

on:
  push:
    branches:
      - canonical-book-contract-v2

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-book-contract-v2
          fetch-depth: 0
      - name: Preserve current publication metadata and merge main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- books/the-orphan-age/README.md
          git add books/the-orphan-age/README.md
          if ! git diff --cached --quiet; then
            git commit -m "Preserve latest Orphan Age publication metadata"
          fi
          git merge --no-edit origin/main
          git push origin HEAD:canonical-book-contract-v2
