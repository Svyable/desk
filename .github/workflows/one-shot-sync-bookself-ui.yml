name: One-shot Bookself UI sync

on:
  push:
    branches: [instance-foundation]
    paths:
      - .github/workflows/one-shot-sync-bookself-ui.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out binder branch
        uses: actions/checkout@v4
        with:
          ref: instance-foundation
          fetch-depth: 0

      - name: Check out Bookself foundation
        uses: actions/checkout@v4
        with:
          repository: Svyable/bookself
          ref: instance-foundation
          path: .bookself-upstream

      - name: Copy shared UI
        run: |
          rm -rf reader desk
          cp -a .bookself-upstream/reader ./reader
          cp -a .bookself-upstream/desk ./desk
          rm -rf .bookself-upstream

      - name: Commit shared UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader desk
          if git diff --cached --quiet; then
            echo "Shared UI already aligned"
            exit 0
          fi
          git commit -m "Sync Bookself reader and publishing desk"
          git push origin HEAD:instance-foundation
