name: One-shot Bookself UI sync

on:
  push:
    branches: [instance-foundation]
    paths:
      - .github/sync-bookself-ui.trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Binder foundation branch
        uses: actions/checkout@v4
        with:
          ref: instance-foundation
          fetch-depth: 0

      - name: Check out Bookself foundation
        uses: actions/checkout@v4
        with:
          repository: Svyable/bookself
          ref: instance-foundation
          path: .bookself-upstream

      - name: Copy shared UI exactly
        run: |
          rm -rf reader desk
          cp -a .bookself-upstream/reader ./reader
          cp -a .bookself-upstream/desk ./desk
          rm -rf .bookself-upstream

      - name: Commit shared UI and remove one-shot trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/sync-bookself-ui.trigger
          git rm -f .github/workflows/one-shot-sync-bookself-ui.yml
          git add reader desk
          git commit -m "Sync shared Bookself reader and publishing desk"
          git push origin HEAD:instance-foundation
