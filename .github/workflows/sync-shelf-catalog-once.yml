name: Sync Desk catalog from Shelf once

on:
  push:
    branches:
      - catalog/sync-after-restructuring-america-release

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Desk sync branch
        uses: actions/checkout@v4
        with:
          ref: catalog/sync-after-restructuring-america-release
          path: desk
          fetch-depth: 0

      - name: Check out current Shelf
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/Svyable/shelf.git shelf

      - name: Regenerate Desk catalog against Shelf
        shell: bash
        run: |
          set -euo pipefail
          cd desk
          python3 scripts/catalog.py --write --shelf-root "$GITHUB_WORKSPACE/shelf"

      - name: Remove one-shot workflow and commit catalog truth
        shell: bash
        run: |
          set -euo pipefail
          rm -f desk/.github/workflows/sync-shelf-catalog-once.yml
          git -C desk config user.name 'Svyable Catalog Automation'
          git -C desk config user.email '129682319+Svyable@users.noreply.github.com'
          git -C desk add README.md .github/workflows/sync-shelf-catalog-once.yml
          git -C desk diff --cached --check
          git -C desk commit -m 'Sync Shelf release catalog after Restructuring America [catalog-generated]'
          git -C desk push origin HEAD:catalog/sync-after-restructuring-america-release
