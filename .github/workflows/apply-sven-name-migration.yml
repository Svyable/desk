name: Apply Sven Hardy Benson book-name migration

on:
  push:
    branches:
      - cleanup/sven-hardy-benson-book-copy

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/sven-hardy-benson-book-copy
      - name: Update reader-facing book copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('books')
          broad_replacements = {
              '@Svyable': 'Sven Hardy Benson',
              '@svyable': 'Sven Hardy Benson',
              'Svyable Desk': 'Sven Hardy Benson’s Desk',
              'Svyable Binder': 'Sven Hardy Benson’s Desk',
              'Svyable Shelf': 'Sven Hardy Benson’s Shelf',
          }

          for path in sorted(root.rglob('*.md')):
              if '_TEMPLATE' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in broad_replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          long_mind = Path('books/the-long-running-mind/manuscript/back-matter.md')
          if long_mind.is_file():
              text = long_mind.read_text(encoding='utf-8')
              text = text.replace(
                  'Drafted for the `Svyable/desk` collection on August 30, 2026.',
                  'Drafted for Sven Hardy Benson’s Desk (`Svyable/desk`) on August 30, 2026.',
              )
              long_mind.write_text(text, encoding='utf-8')

          unbounding_files = [
              Path('books/the-unbounding/manuscript/ch01-the-acceleration-point.md'),
              Path('books/the-unbounding/manuscript/ch03-erdos-ghosts-and-unsolved-rooms.md'),
              Path('books/the-unbounding/manuscript/ch15-svyable-split-across-futures.md'),
              Path('books/the-unbounding/manuscript/ch19-the-unbounding.md'),
          ]
          for path in unbounding_files:
              if path.is_file():
                  text = path.read_text(encoding='utf-8')
                  path.write_text(text.replace('Svyable', 'Sven Hardy Benson'), encoding='utf-8')

          readme = Path('books/the-unbounding/README.md')
          if readme.is_file():
              text = readme.read_text(encoding='utf-8')
              text = text.replace('Ch 15 — Svyable, Split Across Futures', 'Ch 15 — Sven Hardy Benson, Split Across Futures')
              text = text.replace('manuscript/ch15-svyable-split-across-futures.md', 'manuscript/ch15-sven-hardy-benson-split-across-futures.md')
              readme.write_text(text, encoding='utf-8')
          PY

          if [ -f books/the-unbounding/manuscript/ch15-svyable-split-across-futures.md ]; then
            git mv \
              books/the-unbounding/manuscript/ch15-svyable-split-across-futures.md \
              books/the-unbounding/manuscript/ch15-sven-hardy-benson-split-across-futures.md
          fi

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git config user.name "Sven Benson"
          git config user.email "129682319+Svyable@users.noreply.github.com"
          git add books
          git commit -m "Standardize book drafts on Sven Hardy Benson"
          git push origin HEAD:cleanup/sven-hardy-benson-book-copy
