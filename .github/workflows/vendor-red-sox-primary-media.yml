name: Vendor Red Sox Diplomacy primary media

on:
  push:
    branches:
      - book/red-sox-diplomacy-20260912-sol
    paths:
      - 'books/red-sox-diplomacy/research/primary-media-acquisition*.json'
      - .github/workflows/vendor-red-sox-primary-media.yml

permissions:
  contents: write

concurrency:
  group: red-sox-primary-media-vendor
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fetch documented primary-source media and localize manuscript embeds
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          research = pathlib.Path('books/red-sox-diplomacy/research')
          manifest_paths = sorted(research.glob('primary-media-acquisition*.json'))
          if not manifest_paths:
              raise SystemExit('No primary-media acquisition manifests found.')

          manifests = [json.loads(path.read_text(encoding='utf-8')) for path in manifest_paths]
          roots = {m['destination_root'] for m in manifests}
          if len(roots) != 1:
              raise SystemExit(f'Manifests disagree on destination_root: {sorted(roots)}')
          root = pathlib.Path(roots.pop())
          root.mkdir(parents=True, exist_ok=True)

          assets = []
          seen = set()
          for path, manifest in zip(manifest_paths, manifests):
              for item in manifest['assets']:
                  dest = item['dest']
                  if dest in seen:
                      raise SystemExit(f'Duplicate destination {dest!r} in {path}')
                  seen.add(dest)
                  tagged = dict(item)
                  tagged['_manifest'] = path.name
                  assets.append(tagged)

          successes = []
          failures = []

          def fetch(url, tmp):
              delays = (0, 3, 8, 15)
              last_error = None
              for attempt, delay in enumerate(delays, start=1):
                  if delay:
                      time.sleep(delay)
                  req = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'Svyable-Desk-primary-media-vendor/1.4 (+https://github.com/Svyable/desk)',
                          'Accept': '*/*',
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=120) as response, open(tmp, 'wb') as out:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              out.write(chunk)
                      return
                  except urllib.error.HTTPError as exc:
                      last_error = exc
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == len(delays):
                          raise
                      if tmp.exists():
                          tmp.unlink()
                      print(f'RETRY {attempt}/{len(delays)} after HTTP {exc.code}: {url}')
                  except Exception as exc:
                      last_error = exc
                      if attempt == len(delays):
                          raise
                      if tmp.exists():
                          tmp.unlink()
                      print(f'RETRY {attempt}/{len(delays)} after {type(exc).__name__}: {url}')
              raise last_error

          def record(item, dest, status):
              data = dest.read_bytes()
              successes.append({
                  'dest': str(dest),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'archive_record': item['archive_record'],
                  'rights': item['rights'],
                  'maker': item['maker'],
                  'date': item['date'],
                  'chapter': item['chapter'],
                  'job': item['job'],
                  'manifest': item['_manifest'],
                  'acquisition_status': status,
              })
              print(f'{status.upper()} {dest} ({len(data):,} bytes)')

          for item in assets:
              dest = root / item['dest']
              is_commons = 'commons_filename' in item

              if dest.exists() and dest.stat().st_size >= 1024:
                  record(item, dest, 'reused')
                  continue

              if is_commons:
                  quoted = urllib.parse.quote(item['commons_filename'], safe='')
                  url = f'https://commons.wikimedia.org/wiki/Special:Redirect/file/{quoted}'
              else:
                  url = item['url']

              tmp = dest.with_suffix(dest.suffix + '.part')
              try:
                  fetch(url, tmp)
                  size = tmp.stat().st_size
                  if size < 1024:
                      raise RuntimeError(f'file unexpectedly small: {size} bytes')
                  os.replace(tmp, dest)
                  record(item, dest, 'acquired')
              except Exception as exc:
                  if tmp.exists():
                      tmp.unlink()
                  failures.append({
                      'dest': str(dest),
                      'archive_record': item['archive_record'],
                      'manifest': item['_manifest'],
                      'error': f'{type(exc).__name__}: {exc}',
                  })
                  print(f'FAILED {dest}: {exc}')
              finally:
                  if is_commons:
                      time.sleep(1.0)

          if not successes:
              raise SystemExit('No primary-source media could be acquired or reused.')

          sums = ''.join(f"{row['sha256']}  {pathlib.Path(row['dest']).name}\n" for row in sorted(successes, key=lambda x: x['dest']))
          (root / 'SHA256SUMS.txt').write_text(sums, encoding='utf-8')

          report = {
              'manifest_files': [p.name for p in manifest_paths],
              'manifest_versions': {p.name: m.get('version') for p, m in zip(manifest_paths, manifests)},
              'acquired_count': sum(row['acquisition_status'] == 'acquired' for row in successes),
              'reused_count': sum(row['acquisition_status'] == 'reused' for row in successes),
              'available_count': len(successes),
              'failed_count': len(failures),
              'available': successes,
              'failed': failures,
          }
          (root / 'acquisition-report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          md = [
              '# Primary-source media acquisition report',
              '',
              f"Available locally: **{len(successes)}**  ",
              f"Newly acquired this run: **{report['acquired_count']}**  ",
              f"Reused from repo: **{report['reused_count']}**  ",
              f"Failed: **{len(failures)}**",
              '',
              'The files below correspond to archive records in the batched `research/primary-media-acquisition*.json` manifests. Rights claims are copied from the source audit and remain subject to release-stage re-verification.',
              '',
              '## Available',
              '',
          ]
          for row in successes:
              md.append(
                  f"- `{pathlib.Path(row['dest']).name}` — {row['maker']}, {row['date']}; {row['rights']}; {row['bytes']:,} bytes; SHA-256 `{row['sha256']}`; status `{row['acquisition_status']}`; manifest `{row['manifest']}`; [archive record]({row['archive_record']})"
              )
          if failures:
              md += ['', '## Failed', '']
              for row in failures:
                  md.append(f"- `{pathlib.Path(row['dest']).name}` — `{row['error']}`; manifest `{row['manifest']}`; [archive record]({row['archive_record']})")
          (root / 'README.md').write_text('\n'.join(md) + '\n', encoding='utf-8')

          # Localize only Markdown *image embeds*. Provenance/archive hyperlinks in
          # captions remain remote and therefore inspectable by readers.
          by_commons_name = {}
          by_direct_url = {}
          for item in assets:
              local_file = root / item['dest']
              if not local_file.exists():
                  continue
              if 'commons_filename' in item:
                  key = item['commons_filename'].replace('_', ' ')
                  by_commons_name[key] = local_file
              if 'url' in item:
                  by_direct_url[item['url']] = local_file

          image_re = re.compile(r'!\[([^\]]*)\]\((https?://[^)]+)\)')
          manuscript_root = pathlib.Path('books/red-sox-diplomacy/manuscript')
          localization = []

          for md_path in sorted(manuscript_root.glob('*.md')):
              text = md_path.read_text(encoding='utf-8')
              changes = []

              def repl(match):
                  alt, url = match.group(1), match.group(2)
                  local_file = by_direct_url.get(url)
                  if local_file is None and 'commons.wikimedia.org/wiki/Special:Redirect/file/' in url:
                      remote_name = urllib.parse.unquote(url.rsplit('/', 1)[-1]).replace('_', ' ')
                      local_file = by_commons_name.get(remote_name)
                  if local_file is None:
                      return match.group(0)
                  rel = pathlib.PurePosixPath(os.path.relpath(local_file, md_path.parent)).as_posix()
                  changes.append({'remote': url, 'local': rel})
                  return f'![{alt}]({rel})'

              updated = image_re.sub(repl, text)
              if updated != text:
                  md_path.write_text(updated, encoding='utf-8')
                  localization.append({'path': str(md_path), 'changes': changes})
                  print(f'LOCALIZED {md_path}: {len(changes)} image embed(s)')

          (root / 'localization-report.json').write_text(
              json.dumps({'changed_files': len(localization), 'files': localization}, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit acquired media and localized embeds to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/red-sox-diplomacy/media/primary-source books/red-sox-diplomacy/manuscript
          if git diff --cached --quiet; then
            echo "No media or localization changes to commit."
            exit 0
          fi

          git commit -m "media: vendor and localize Red Sox Diplomacy primary assets [media-vendor]"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Branch moved during media push attempt ${attempt}; retrying without force."
            sleep $((attempt * 2))
          done

          echo "Could not fast-forward primary media after 5 attempts." >&2
          exit 1
