name: City book length audit

on:
  push:
    branches:
      - book/most-important-city-america

jobs:
  length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Desk book-length gate
        run: python3 scripts/check-book-length.py the-most-important-city-in-america --json
