name: Prepare Renegade publication bookkeeping

on:
  push:
    branches:
      - release/renegade-code-first-edition-bookkeeping

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch proposed Shelf counterpart
        run: |
          git clone --filter=blob:none --branch release/renegade-code-first-edition-2026-09-07 https://github.com/Svyable/shelf.git /tmp/shelf
      - name: Regenerate Desk cross-Shelf bookkeeping
        run: |
          python3 scripts/catalog.py --write --shelf-root /tmp/shelf
          BOOKSELF_SHELF_CATALOG=/tmp/shelf/catalog.json python3 scripts/sync-reader-links.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('books/renegade-code/README.md')
          text = p.read_text()
          needle = '| **Edition** | First complete Desk draft · September 2026 |\n'
          row = '| **Release Review** | First edition publication transaction · frozen Desk source `cba805b0301f78f591c67c5d7f8c303304da108c` · Shelf counterpart #244 |\n'
          if row not in text:
              if needle not in text:
                  raise SystemExit('Renegade Edition row not found')
              text = text.replace(needle, needle + row, 1)
              p.write_text(text)
          PY
      - name: Validate publication-side scope
        run: |
          cp README.md /tmp/desk-root-before.md
          cp catalog.json /tmp/desk-catalog-before.json
          python3 scripts/catalog.py --write --shelf-root /tmp/shelf
          cmp README.md /tmp/desk-root-before.md
          cmp catalog.json /tmp/desk-catalog-before.json
          BOOKSELF_SHELF_CATALOG=/tmp/shelf/catalog.json python3 scripts/sync-reader-links.py --check
          test ! -e .github/workflows/sync-reader-links.yml
          grep -F 'Published edition · Shelf Reader' books/renegade-code/README.md
          grep -F 'frozen Desk source `cba805b0301f78f591c67c5d7f8c303304da108c`' books/renegade-code/README.md
      - name: Finalize bookkeeping branch without workflow
        run: |
          rm .github/workflows/prepare-renegade-bookkeeping.yml
          git config user.name "Sven Benson"
          git config user.email "129682319+Svyable@users.noreply.github.com"
          git add -A
          git commit -m "Record Renegade Code first-edition publication"
          git push origin HEAD:release/renegade-code-first-edition-bookkeeping
