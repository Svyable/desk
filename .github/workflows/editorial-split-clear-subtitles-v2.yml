name: Editorial split clear subtitles v2

on:
  push:
    branches:
      - editorial-split-clear-subtitles-v2

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial-split-clear-subtitles-v2
      - name: Apply exact editorial splits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_exact(path, old, new):
              p = Path(path); text = p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'expected text not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          replacements = [
            ('books/bookself/README.md', '# Bookself: The Story of Getting Started\n\n| | |', '# Bookself\n\n*The Story of Getting Started*\n\n| | |'),
            ('books/bookself/README.md', '\n*The Story of Getting Started*\n\nMost advice about beginning', '\nMost advice about beginning'),
            ('books/bookself/manuscript/front-matter.md', '# Bookself: The Story of Getting Started\n\n**Sven Hardy Benson**', '# Bookself\n\n*The Story of Getting Started*\n\n**Sven Hardy Benson**'),
            ('books/hallucinations/README.md', '# Hallucinations: How AI Leads Us Astray\n\n| | |', '# Hallucinations\n\n*How AI Leads Us Astray*\n\n| | |'),
            ('books/hallucinations/manuscript/front-matter.md', '# Hallucinations: How AI Leads Us Astray\n\n*How AI Leads Us Astray*', '# Hallucinations\n\n*How AI Leads Us Astray*'),
            ('books/the-agentic-consumer-economy/README.md', '# The Agentic Consumer Economy: Digital Capitalism in the 2030s\n\n| | |', '# The Agentic Consumer Economy\n\n*Digital Capitalism in the 2030s*\n\n| | |'),
            ('books/the-agentic-consumer-economy/manuscript/front-matter.md', '# The Agentic Consumer Economy: Digital Capitalism in the 2030s\n\n**Sven Hardy Benson**', '# The Agentic Consumer Economy\n\n*Digital Capitalism in the 2030s*\n\n**Sven Hardy Benson**'),
            ('books/the-risk-pool/README.md', '# The Risk Pool: How Insurance Quietly Decides What Can Be Built, Bought, Borrowed, and Rebuilt\n\n| | |', '# The Risk Pool\n\n*How Insurance Quietly Decides What Can Be Built, Bought, Borrowed, and Rebuilt*\n\n| | |'),
            ('books/the-risk-pool/manuscript/front-matter.md', '# The Risk Pool: How Insurance Quietly Decides What Can Be Built, Bought, Borrowed, and Rebuilt\n\n**Sven Hardy Benson**', '# The Risk Pool\n\n*How Insurance Quietly Decides What Can Be Built, Bought, Borrowed, and Rebuilt*\n\n**Sven Hardy Benson**'),
          ]
          for args in replacements: replace_exact(*args)
          PY
      - name: Validate complete title contract
        run: |
          python3 scripts/align-title-pages.py --check
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 8
          ! git diff --name-only | grep -Eq '(^|/)(RIGHTS\.md|rights\.json)$'
          grep -q '^# The Swarm: Agents in the Wild$' books/the-swarm-agents-in-the-wild/README.md
      - name: Commit exact book changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/bookself books/hallucinations books/the-agentic-consumer-economy books/the-risk-pool
          git commit -m "Split clear subtitles from display titles"
          git push origin HEAD:editorial-split-clear-subtitles-v2
