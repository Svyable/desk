name: Desk Reader startup

on:
  pull_request:
    paths:
      - "reader/**"
      - "desk/*export*.js"
      - "desk/*export*.test.mjs"
      - ".github/workflows/reader-startup.yml"
  push:
    branches:
      - main
    paths:
      - "reader/**"
      - "desk/*export*.js"
      - "desk/*export*.test.mjs"
      - ".github/workflows/reader-startup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Desk startup modules
        run: |
          cp reader/js/app-loader.js /tmp/desk-app-loader.mjs
          cp reader/js/desk-viewport-stability-runtime.js /tmp/desk-viewport-stability-runtime.mjs
          node --check /tmp/desk-app-loader.mjs
          node --check /tmp/desk-viewport-stability-runtime.mjs
      - name: Verify localized Reader contracts
        run: |
          node --test \
            reader/js/desk-offline-runtime-contract.test.mjs \
            reader/js/desk-page-tap-policy.test.mjs \
            reader/js/desk-book-opening-handoff-contract.test.mjs \
            reader/js/library-sort-model.test.mjs \
            reader/js/reading-trail-model.test.mjs
      - name: Verify Desk publication exports
        run: |
          node --test \
            desk/epub-export.test.mjs \
            desk/kdp-export.test.mjs \
            desk/publication-export-rights.test.mjs
