name: Red Sox Diplomacy publication gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/red-sox-diplomacy-publication-gates.yml"
      - "books/red-sox-diplomacy/research/source-ledger-addendum-*.csv"
      - "books/red-sox-diplomacy/research/rebuild-source-ledger.py"
      - "books/red-sox-diplomacy/README.md"
      - "catalog.json"
      - "llms.txt"
      - "sitemap.xml"
      - "reader/**"

permissions:
  contents: write

jobs:
  publication-gates:
    if: github.event.pull_request.number == 1786 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure integration identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconcile main, ledger, and generated catalog
        run: |
          set -euo pipefail
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main "${GITHUB_HEAD_REF}"
            git merge --no-edit "origin/${GITHUB_HEAD_REF}"
            git merge --no-edit origin/main

            if [ -f books/red-sox-diplomacy/research/source-ledger-rebuild-report.json ]; then
              echo "Canonical ledger report already exists; preserving completed rebuild."
            else
              python3 books/red-sox-diplomacy/research/rebuild-source-ledger.py --write
            fi

            python3 scripts/catalog.py --write

            git add \
              books/red-sox-diplomacy/research/source-ledger.csv \
              books/red-sox-diplomacy/research/source-ledger-rebuild-report.json \
              README.md

            if ! git diff --cached --quiet; then
              git commit -m "Finalize Red Sox Diplomacy publication outputs"
            fi

            if git push origin "HEAD:${GITHUB_HEAD_REF}"; then
              pushed=1
              break
            fi

            echo "Branch advanced during publication integration; reconciling and retrying (${attempt}/3)."
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Unable to push a non-forced publication integration after 3 attempts." >&2
            exit 1
          fi

      - name: Run Desk validation
        run: python3 scripts/check-desk.py
