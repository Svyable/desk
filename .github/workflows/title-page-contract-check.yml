name: Title-page contract validation

on:
  push:
    branches:
      - canonical-book-starter

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show any residual title-page drift
        run: |
          python3 scripts/align-title-pages.py --write
          git diff --check
          git diff --name-only
          git diff -- books
          test -z "$(git status --short -- books)"
