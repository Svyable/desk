name: Title-page contract validation

on:
  push:
    branches:
      - canonical-book-starter

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check current books remain canonical
        run: |
          python3 scripts/align-title-pages.py --check
          git diff --check
