name: Neuralase release gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out frozen PR source
        uses: actions/checkout@v4
      - name: Validate Neuralase chapter length
        run: python3 scripts/check-book-length.py neuralase
      - name: Validate Desk integrity
        run: python3 scripts/check-desk.py
