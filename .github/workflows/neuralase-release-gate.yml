name: Neuralase release gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical frozen Neuralase source
        uses: actions/checkout@v4
        with:
          ref: 688016d3fa1031038dd6bf6bfba8c8a4845df351
      - name: Validate Neuralase chapter length
        run: python3 scripts/check-book-length.py neuralase
