name: Validate Sven Desk branding final

on:
  push:
    branches:
      - brand-sven-desk-public-surfaces-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-sven-desk-public-surfaces-v2
      - name: Validate identity boundaries
        run: |
          node desk/authoring-role-policy.test.mjs
          node desk/catalog-contract.test.mjs
          node reader/js/desk-app-identity.test.mjs
          node reader/js/desk-pwa-contract.test.mjs
          node --check desk/authoring-boundary.js
          node --check desk/authoring-role-policy.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          imprint = json.loads(Path('imprint.json').read_text(encoding='utf-8'))
          assert imprint['brandOwner'] == 'Sven Hardy Benson'
          assert imprint['owner'] == 'Svyable'
          assert imprint['github']['owner'] == 'Svyable'

          reader = Path('reader/index.html').read_text(encoding='utf-8')
          assert 'Sven Hardy Benson’s Desk — Reader' in reader
          assert '<link rel="canonical" href="https://svyable.github.io/desk/reader/">' in reader
          assert '<base href="https://svyable.github.io/shelf/reader/">' in reader

          boundary = Path('desk/authoring-boundary.js').read_text(encoding='utf-8')
          assert 'imprint.brandOwner || imprint.owner' in boundary
          PY
          git diff --check origin/main...HEAD
