name: Temporary Bookself catalog refresh

on:
  push:
    branches:
      - catalog/bookself-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh generated Desk dashboard
        run: |
          python3 scripts/catalog.py --root . --write || true
          grep -q 'books/bookself/' README.md
      - name: Commit generated README and remove this temporary workflow
        run: |
          rm .github/workflows/refresh-bookself-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/refresh-bookself-catalog.yml
          if git diff --cached --quiet; then
            echo "No catalog changes needed."
            exit 0
          fi
          git commit -m "Refresh Desk catalog for Bookself"
          git push
