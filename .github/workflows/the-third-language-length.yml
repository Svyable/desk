name: The Third Language length

on:
  pull_request:
    paths:
      - 'books/the-third-language/**'
      - 'scripts/check-book-length.py'
      - '.github/workflows/the-third-language-length.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check one-shot manuscript length
        run: python3 scripts/check-book-length.py the-third-language --json
