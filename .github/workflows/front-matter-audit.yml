name: Front matter alignment migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Create migration branch
        run: git switch -c aligned-book-title-pages
      - name: Align title pages
        run: python3 scripts/align-title-pages.py --write
      - name: Polish title and subtitle display
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('books')
          section_names = {
              'about the author', 'acknowledgments', 'acknowledgements', 'author note',
              "author's note", 'author’s note', 'contents', 'dedication', 'foreword',
              'introduction', 'note to the reader', 'preface', 'prologue', 'research', 'sources',
          }

          def plain(line):
              value = line.strip()
              value = re.sub(r'^##\s+', '', value)
              value = re.sub(r'^\*\*(.+)\*\*$', r'\1', value)
              value = re.sub(r'^__(.+)__$', r'\1', value)
              value = re.sub(r'^\*(.+)\*$', r'\1', value)
              value = re.sub(r'^_(.+)_$', r'\1', value)
              return value.strip()

          def trim_period(value):
              value = value.strip()
              if value.endswith('.') and not value.endswith('...'):
                  return value[:-1].rstrip()
              return value

          def normalize_opening(path, *, readme=False):
              if not path.is_file():
                  return
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              h1 = next((i for i, line in enumerate(lines) if re.match(r'^#\s+', line)), None)
              if h1 is None:
                  return
              candidate = None
              for i in range(h1 + 1, len(lines)):
                  stripped = lines[i].strip()
                  if not stripped:
                      continue
                  if stripped.startswith('|') or stripped == '---':
                      break
                  if readme and stripped.startswith('## '):
                      value = plain(stripped)
                      if value.lower() in section_names:
                          break
                      candidate = i
                      break
                  if re.match(r'^(?:\*\*|__|\*|_).+(?:\*\*|__|\*|_)$', stripped):
                      value = plain(stripped)
                      if value.casefold() in {'sven benson', 'sven hard benson', 'sven hardy benson'}:
                          break
                      candidate = i
                      break
                  break
              if candidate is None:
                  return
              subtitle = trim_period(plain(lines[candidate]))
              title = re.sub(r'^#\s+', '', lines[h1]).strip()
              if title.endswith(':'):
                  title = title[:-1].rstrip()
                  lines[h1] = f'# {title}'
              lines[candidate] = f'*{subtitle}*'
              path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          for book in sorted(root.iterdir()):
              if not book.is_dir() or book.name.startswith(('_', 'style-', '.')):
                  continue
              readme = book / 'README.md'
              if not readme.is_file():
                  continue
              normalize_opening(readme, readme=True)
              text = readme.read_text(encoding='utf-8')
              named = re.search(r'\[Front Matter\]\((manuscript/[^)\s]+\.md)\)', text, re.I)
              if named:
                  target = book / named.group(1)
              elif (book / 'manuscript' / 'front-matter.md').is_file():
                  target = book / 'manuscript' / 'front-matter.md'
              else:
                  links = list(dict.fromkeys(re.findall(r'\]\((manuscript/[^)\s]+\.md)\)', text, re.I)))
                  target = book / links[0] if len(links) == 1 else None
              if target:
                  normalize_opening(target)
          PY
      - name: Verify alignment
        run: |
          python3 scripts/align-title-pages.py --check
          git diff --check
      - name: Commit generated book changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books
          if git diff --cached --quiet; then
            echo "No title-page changes to commit."
            exit 0
          fi
          git commit -m "Align book titles and front matter"
          git push --force origin HEAD:aligned-book-title-pages
