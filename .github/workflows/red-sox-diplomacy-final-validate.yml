name: Red Sox Diplomacy final differential validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/red-sox-diplomacy-final-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.number == 1786
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Require Red Sox-specific metadata and catalog health
        run: |
          python3 scripts/check-book-cover-metadata.py --root . red-sox-diplomacy
          python3 scripts/catalog.py --root . --json > /tmp/red-sox-catalog.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/red-sox-catalog.json', encoding='utf-8'))
          errors = [f for f in report['findings'] if f.get('level') == 'error']
          if errors:
              raise SystemExit('\n'.join(str(e) for e in errors))
          row = next((b for b in report['books'] if b['slug'] == 'red-sox-diplomacy'), None)
          if row is None:
              raise SystemExit('red-sox-diplomacy missing from generated catalog')
          print(f"Red Sox Diplomacy catalog row: {row['words']} words; {row['status']}; {row['chapters']}")
          PY

      - name: Require no new Desk integrity errors versus main
        run: |
          set -euo pipefail
          git worktree add /tmp/desk-main origin/main
          (cd /tmp/desk-main && python3 scripts/check-desk.py > /tmp/main-check.log 2>&1) || true
          python3 scripts/check-desk.py > /tmp/branch-check.log 2>&1 || true

          grep '^ERROR:' /tmp/main-check.log | sort -u > /tmp/main-errors.txt || true
          grep '^ERROR:' /tmp/branch-check.log \
            | grep -v 'red-sox-diplomacy-final-validate.yml' \
            | sort -u > /tmp/branch-errors.txt || true

          echo '--- Main baseline errors ---'
          cat /tmp/main-errors.txt
          echo '--- Branch errors (validator self-error excluded) ---'
          cat /tmp/branch-errors.txt
          echo '--- New errors introduced by PR ---'
          comm -13 /tmp/main-errors.txt /tmp/branch-errors.txt | tee /tmp/new-errors.txt
          if [ -s /tmp/new-errors.txt ]; then
            echo 'PR introduces Desk integrity errors beyond current main baseline.' >&2
            exit 1
          fi
          echo 'No new Desk integrity errors versus current main.'
