name: Temporary Handoff catalog refresh

on:
  push:
    branches:
      - refresh/hundred-year-handoff-catalog

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refresh/hundred-year-handoff-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh generated Desk catalog
        run: python3 scripts/catalog.py --write
      - name: Remove temporary workflow and commit generated changes
        run: |
          rm .github/workflows/_tmp-refresh-handoff-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Refresh Desk catalog after Hundred-Year Handoff update"
            git push origin HEAD:refresh/hundred-year-handoff-catalog
          fi
