name: Record WTA publication provenance

on:
  push:
    branches:
      - release/who-taught-america-publication-record-2026-09-06
    paths:
      - .github/workflows/record-wta-publication.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out provenance branch
        uses: actions/checkout@v4
        with:
          ref: release/who-taught-america-publication-record-2026-09-06
          fetch-depth: 0

      - name: Record released first edition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme_path = Path('books/who-taught-america/README.md')
          checklist_path = Path('books/who-taught-america/research/publication-checklist.md')
          readme = readme_path.read_text(encoding='utf-8')

          old_meta = '\n'.join([
              '| **Author**    | Sven Hardy Benson |',
              '| **Status**    | Complete draft · publication review |',
              '| **Drafting Source** | Sven Hardy Benson’s Desk |',
              '| **Publication Surface** | Sven Hardy Benson’s Shelf |',
              '| **Chapters**  | 26 of 26 drafted |',
          ])
          new_meta = '\n'.join([
              '| **Author** | Sven Hardy Benson |',
              '| **Status** | Complete draft |',
              '| **Format** | Book |',
              '| **Publisher** | Svyable |',
              '| **Edition** | First edition |',
              '| **Language** | English |',
              '| **Draft date** | 2026-09-06 |',
              '| **Candidate date** | 2026-09-06 |',
              '| **Drafting Source** | Sven Hardy Benson’s Desk |',
              '| **Publication Surface** | Sven Hardy Benson’s Shelf |',
              '| **Chapters** | 26 of 26 drafted |',
              '| **Release Review** | First edition released — canonical freeze `1ea139b81bb4822f438c98942676d8b334a38a99`; Desk release gates merged in PR #1210 |',
          ])
          if readme.count(old_meta) != 1:
              raise SystemExit('README metadata anchor not found exactly once')
          readme = readme.replace(old_meta, new_meta)

          old_state = 'The complete manuscript is now in publication review. Early and middle chapter evidence packets have been strengthened with additional primary, governmental, archival, and scholarly sources. Shelf publication remains behind objective gates only: the exact repository length check, final manuscript-to-source reconciliation, current catalog/discovery synchronization, and `scripts/check-desk.py` on the same frozen source.'
          new_state = '\n'.join([
              'The complete manuscript passed first-edition release review. Early and middle chapter evidence packets were strengthened with additional primary, governmental, archival, and scholarly sources, and the frozen candidate cleared the exact repository length check, manuscript-to-source reconciliation, discovery synchronization, and baseline-aware Desk integrity gate before release.',
              '',
              '## Publication',
              '',
              '- First Shelf edition frozen from Desk source `1ea139b81bb4822f438c98942676d8b334a38a99`.',
              '- Shelf first-edition release: `57d4cedf89af84156aabbd6fea3758e576424ae6` (Shelf PR #242).',
              '- [Open the released Shelf edition](https://svyable.github.io/shelf/reader/#/b/who-taught-america/)',
              '- Desk remains the working edition for future revisions; Shelf is the frozen public first edition.',
          ])
          if readme.count(old_state) != 1:
              raise SystemExit('README publication-state anchor not found exactly once')
          readme = readme.replace(old_state, new_state)
          readme_path.write_text(readme, encoding='utf-8')

          checklist = checklist_path.read_text(encoding='utf-8')
          intro_old = 'This checklist governs the first publication candidate for **Who Taught America? — Twenty-Six Schools, 250 Years, and the Classrooms That Made a Nation**. Desk remains the canonical working source. Sven Hardy Benson’s Shelf will hold a frozen released snapshot, not a live mirror.'
          intro_new = 'This checklist governs the first publication candidate and release record for **Who Taught America? — Twenty-Six Schools, 250 Years, and the Classrooms That Made a Nation**. Desk remains the canonical working source. Sven Hardy Benson’s Shelf holds a frozen released snapshot, not a live mirror.'
          if checklist.count(intro_old) != 1:
              raise SystemExit('checklist intro anchor not found exactly once')
          checklist = checklist.replace(intro_old, intro_new)

          gate1_old = 'The connected environment used for this publication-preparation pass cannot execute the local checker from a live checkout. File size is not a substitute for the repository’s `WORD_RE` count, so no mechanical length pass is inferred.'
          gate1_new = 'The exact repository length checker was later run on the frozen release source and passed: **26 numbered chapters, 79,466 chapter-only words, smallest chapter 3,027 words**. No mechanical length result is inferred from file size.'
          if checklist.count(gate1_old) != 1:
              raise SystemExit('checklist Gate 1 anchor not found exactly once')
          checklist = checklist.replace(gate1_old, gate1_new)

          gate5_old = '\n'.join([
              '- [x] Desk status is **Complete draft · publication review** rather than `Published`.',
              '- [x] No Shelf snapshot has been created by this publication-preparation branch.',
              '',
              'The author asked to continue toward publication on 2026-09-06. This authorizes candidate preparation and objective release-gate work. It does not override a failing length, integrity, rights, or source check.',
          ])
          gate5_new = '\n'.join([
              '- [x] Desk remains the working edition and is not marked `Published`.',
              '- [x] Shelf carries the frozen first released edition with status exactly `Published`.',
              '',
              'The author asked to continue toward publication on 2026-09-06. The objective release gates were satisfied and the first Shelf edition is now released.',
          ])
          if checklist.count(gate5_old) != 1:
              raise SystemExit('checklist Gate 5 anchor not found exactly once')
          checklist = checklist.replace(gate5_old, gate5_new)

          gate6_start = checklist.index('## Gate 6 — Freeze and release transaction')
          release_rule_start = checklist.index('## Release rule', gate6_start)
          replacement = '\n'.join([
              '## Gate 6 — Freeze and release transaction',
              '',
              '- [x] Freeze the first-edition candidate under Desk ref `release/who-taught-america-first-edition-2026-09-06`, commit `1ea139b81bb4822f438c98942676d8b334a38a99`.',
              '- [x] Run `python3 scripts/check-book-length.py who-taught-america` on that frozen source: 26 chapters, 79,466 chapter-only words, smallest chapter 3,027 words.',
              '- [x] Run the baseline-aware Desk integrity gate on the frozen candidate and record zero new research-schema failures, zero candidate non-research errors, and a canonical Who Taught America source packet.',
              '- [x] Prepare the Shelf snapshot using the repository’s `scripts/release-book.py` semantics from the exact frozen Desk source.',
              '- [x] Copy the committed Desk book snapshot to Shelf with **42 non-README publication files byte-identical** to the frozen source; transform only the Shelf book README to `Published` plus normal Shelf catalog/feedback registration.',
              '- [x] Verify `catalog.json` contains `who-taught-america` exactly once and the root Shelf README contains the Reader route exactly once.',
              '- [x] Verify Shelf feedback coverage: all 55 released publication slugs covered on the release candidate and on merged `main`.',
              '- [x] Merge Shelf PR #242 as first-edition release commit `57d4cedf89af84156aabbd6fea3758e576424ae6`.',
              '- [x] Record the frozen Desk source and released Shelf route in the Desk book README.',
              '',
              '## Release record',
              '',
              '- Desk release-gate merge: Desk PR #1210, squash merge `0c31a5e92b61aaf4ca06b7ace9aafceb05134b48`.',
              '- Canonical frozen Desk source: `1ea139b81bb4822f438c98942676d8b334a38a99`.',
              '- Shelf first-edition release: Shelf PR #242, squash merge `57d4cedf89af84156aabbd6fea3758e576424ae6`.',
              '- Manuscript tree on the frozen Desk source: `91e4697ccab60b1cafbecd443ffcd168c6e68074`.',
              '- Research tree on the frozen Desk source: `7e25d99837912f60e36c082deb586426ea0dd19c`.',
              '- Released Reader route: `https://svyable.github.io/shelf/reader/#/b/who-taught-america/`.',
              '',
          ])
          checklist = checklist[:gate6_start] + replacement + checklist[release_rule_start:]

          rule_old = '\n'.join([
              '## Release rule',
              '',
              'Do not publish from a moving branch. Publish only from the named frozen Desk candidate after the exact book-length check passes and the baseline-aware Desk integrity gate proves zero new regressions, including a clean canonical source packet for this book. No discretionary human-review blocker is added: once the objective gates recorded here are green, the first-edition release may proceed under the repository’s normal merge and release protections.',
          ])
          rule_new = '\n'.join([
              '## Release rule',
              '',
              'The first edition is released from the named frozen Desk ref `release/who-taught-america-first-edition-2026-09-06`, source commit `1ea139b81bb4822f438c98942676d8b334a38a99`. Shelf is the frozen public edition; later manuscript changes belong on Desk and require a new release transaction unless the author explicitly requests a live public hotfix.',
          ])
          if checklist.count(rule_old) != 1:
              raise SystemExit('checklist release-rule anchor not found exactly once')
          checklist = checklist.replace(rule_old, rule_new)
          checklist_path.write_text(checklist, encoding='utf-8')
          PY

      - name: Verify provenance-only diff and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/record-wta-publication.yml
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/record-wta-publication.yml',
              'books/who-taught-america/README.md',
              'books/who-taught-america/research/publication-checklist.md',
          }
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          paths = set()
          for line in out.splitlines():
              p = line[3:]
              if ' -> ' in p:
                  p = p.split(' -> ', 1)[1]
              paths.add(p)
          if paths != expected:
              raise SystemExit(f'unexpected provenance diff: {sorted(paths)}')
          readme = open('books/who-taught-america/README.md', encoding='utf-8').read()
          checklist = open('books/who-taught-america/research/publication-checklist.md', encoding='utf-8').read()
          required = [
              '57d4cedf89af84156aabbd6fea3758e576424ae6',
              '1ea139b81bb4822f438c98942676d8b334a38a99',
              'https://svyable.github.io/shelf/reader/#/b/who-taught-america/',
          ]
          if any(token not in readme for token in required):
              raise SystemExit('README release provenance incomplete')
          if any(token not in checklist for token in required):
              raise SystemExit('checklist release provenance incomplete')
          if '| **Status** | Complete draft |' not in readme or '| **Status** | Published |' in readme:
              raise SystemExit('Desk working-edition status is wrong')
          print('WTA Desk publication provenance: verified')
          PY
          git config user.name 'Sven Benson'
          git config user.email '129682319+Svyable@users.noreply.github.com'
          git add books/who-taught-america/README.md books/who-taught-america/research/publication-checklist.md
          git add -u .github/workflows/record-wta-publication.yml
          git commit -m 'Record Who Taught America first-edition publication'
          git push origin HEAD:release/who-taught-america-publication-record-2026-09-06
