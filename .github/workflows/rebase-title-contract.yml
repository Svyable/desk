name: Rebase title-page contract

on:
  push:
    branches:
      - canonical-book-contract-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-book-contract-v2
      - name: Carry forward the validated normalizer
        run: curl -fsSL https://raw.githubusercontent.com/Svyable/desk/canonical-book-starter/scripts/align-title-pages.py -o scripts/align-title-pages.py
      - name: Apply canonical title-page rules to current main snapshot
        run: python3 scripts/align-title-pages.py --write
      - name: Verify title-page contract
        run: |
          python3 scripts/align-title-pages.py --check
          git diff --check
          if git diff --name-only | grep -Eq '(^|/)(RIGHTS\.md|rights\.json)$'; then
            echo 'Rights files must not change.' >&2
            exit 1
          fi
      - name: Commit rebased contract changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/align-title-pages.py books
          if git diff --cached --quiet; then
            echo "No title-page changes to commit."
            exit 0
          fi
          git commit -m "Harden canonical book title-page contract"
          git push origin HEAD:canonical-book-contract-v2
