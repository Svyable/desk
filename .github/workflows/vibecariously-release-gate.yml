name: Vibecariously release gate

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify full-book thresholds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('books/vibecariously/manuscript')
          chapters = sorted(root.glob('ch*.md'))
          counts = []
          for path in chapters:
              text = path.read_text(encoding='utf-8')
              words = re.findall(r"\b[\w’'-]+\b", text)
              counts.append((path.name, len(words)))
          total = sum(n for _, n in counts)
          print(f'chapters={len(counts)}')
          for name, n in counts:
              print(f'{name}: {n}')
          print(f'total_words={total}')
          assert len(counts) >= 18, f'need >=18 chapters, got {len(counts)}'
          short = [(name, n) for name, n in counts if n < 3000]
          assert not short, f'chapters below 3000 words: {short}'
          assert total >= 65000, f'need >=65000 words, got {total}'
          PY
      - name: Promote book metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('books/vibecariously/README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('**Status** | Drafting — full structural draft; expansion and citation pass in progress |', '**Status** | Complete draft |')
          old = "The narrative now runs end to end. This branch deliberately remains `Drafting` until the manuscript receives its expansion pass, claim-level citation audit, and repository validation. A checked chapter means a complete narrative chapter exists and is Reader-visible; it does not by itself mean the book has passed the Desk's complete-draft threshold or been approved for Shelf release."
          new = "The full manuscript has completed its expansion pass and the Desk full-book release gate. Research notes remain available for future revision, but this edition is cataloged as a complete draft and is eligible for Shelf publication."
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate Desk catalog
        run: python3 scripts/catalog.py --write
      - name: Validate Desk
        run: python3 scripts/check-desk.py
      - name: Commit release metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/vibecariously/README.md README.md llms.txt sitemap.xml index.html .github/ISSUE_TEMPLATE/book-feedback.yml
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Promote Vibecariously to complete draft'
            git push origin HEAD:main
          fi
