name: One-shot Reader browser regression

on:
  push:
    branches:
      - sync/bookself-reader-runtime-20260914

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Install browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reader-e2e
          npm install --prefix /tmp/reader-e2e playwright@1.55.0
          npx --prefix /tmp/reader-e2e playwright install --with-deps chromium
      - name: Exercise cold layout and Contents drawer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/reader-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/reader/ >/dev/null; then break; fi
            sleep 0.25
          done
          cat >/tmp/reader-e2e/reader-regression.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const base = 'http://127.0.0.1:4173/';
          const prefs = {
            fontSize: 22, font: 'clear', fontWeight: 500, tracking: 0.02,
            leading: 1.8, measure: 'narrow', align: 'left', paragraph: 'airy',
            indent: 'none', mode: 'paged', hyphens: 'off',
          };
          const viewports = [
            { name: 'desktop', width: 1280, height: 900, mobile: false },
            { name: 'tablet', width: 820, height: 1180, mobile: true },
            { name: 'phone', width: 390, height: 844, mobile: true },
          ];

          async function json(path) {
            const response = await fetch(`${base}${path}`);
            assert.equal(response.ok, true, `${path} must load`);
            return response.json();
          }

          const imprint = await json('imprint.json');
          const storageKey = `${imprint.storagePrefix || 'obb'}:reader-experience`;
          const catalog = await json('catalog.json');
          const candidates = (await Promise.all((catalog.books || []).map(async (slug) => {
            const response = await fetch(`${base}books/${encodeURIComponent(slug)}/README.md`);
            if (!response.ok) return null;
            const markdown = await response.text();
            const chapters = [...markdown.matchAll(/^- \[[ xX]\] \[[^\]]+\]\((manuscript\/[^)\s]+)\)/gm)];
            if (!chapters.length) return null;
            return {
              slug,
              count: chapters.length,
              chapter: chapters[0][1].replace(/^manuscript\//, '').replace(/\.md$/i, ''),
            };
          }))).filter(Boolean).sort((a, b) => a.count - b.count || a.slug.localeCompare(b.slug));
          const target = candidates[0];
          assert.ok(target, 'catalog must contain a readable book with a manuscript chapter');
          console.log(`Using ${target.slug} (${target.count} manuscript sections)`);
          const directRead = `reader/?b=${encodeURIComponent(target.slug)}&c=${encodeURIComponent(target.chapter)}&o=0`;

          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                hasTouch: viewport.mobile,
                isMobile: viewport.mobile,
              });
              await context.route('https://**/*', async (route) => {
                const url = new URL(route.request().url());
                if (url.hostname === 'fonts.googleapis.com') {
                  await route.fulfill({ status: 200, contentType: 'text/css', body: '' });
                  return;
                }
                if (url.hostname === 'api.github.com') {
                  await route.fulfill({ status: 200, contentType: 'application/json', body: '[]' });
                  return;
                }
                await route.abort();
              });
              await context.addInitScript(({ key, value }) => localStorage.setItem(key, value), {
                key: storageKey,
                value: JSON.stringify(prefs),
              });
              const page = await context.newPage();
              const errors = [];
              const failed = [];
              page.on('pageerror', (error) => errors.push(error.message));
              page.on('requestfailed', (request) => {
                const url = request.url();
                if (url.startsWith(base)) failed.push(`${request.method()} ${url}: ${request.failure()?.errorText || 'failed'}`);
              });
              await page.goto(`${base}${directRead}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              try {
                await page.waitForFunction(() => document.body.dataset.stage === 'read', null, { timeout: 60000 });
              } catch (error) {
                console.error(`${viewport.name} startup diagnostics`, await page.evaluate(() => ({
                  stage: document.body.dataset.stage,
                  shelfError: document.getElementById('shelfError')?.textContent,
                  totalPages: document.getElementById('totalPages')?.textContent,
                  appBusy: document.getElementById('pagesWrapper')?.getAttribute('aria-busy'),
                })));
                console.error('page errors', errors);
                console.error('failed local requests', failed);
                throw error;
              }
              await page.waitForFunction(() => Number(document.getElementById('totalPages')?.textContent || '0') > 0, null, { timeout: 30000 });

              const firstPaintPrefs = await page.evaluate(() => {
                const root = document.documentElement;
                return {
                  fontSize: root.style.getPropertyValue('--reader-font-size').trim(),
                  leading: root.style.getPropertyValue('--reader-leading').trim(),
                  weight: root.style.getPropertyValue('--reader-font-weight').trim(),
                  tracking: root.style.getPropertyValue('--reader-tracking').trim(),
                  font: root.dataset.readerFont,
                  measure: root.dataset.readerMeasure,
                  align: root.dataset.readerAlign,
                  paragraph: root.dataset.readerParagraph,
                  mode: root.dataset.readerMode,
                  hyphens: root.dataset.readerHyphens,
                };
              });
              assert.deepEqual(firstPaintPrefs, {
                fontSize: '22px', leading: '1.8', weight: '500', tracking: '0.02em',
                font: 'clear', measure: 'narrow', align: 'left', paragraph: 'airy',
                mode: 'paged', hyphens: 'off',
              }, `${viewport.name}: saved spacing/type preferences must be active before any Reader control is touched`);

              await page.evaluate(async () => {
                if (document.fonts?.ready) await document.fonts.ready;
                await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
              });
              const signature = async () => page.evaluate(() => {
                const pages = document.getElementById('pagesWrapper')?.getBoundingClientRect();
                const first = document.querySelector('#pagesWrapper .page-inner')?.getBoundingClientRect();
                return {
                  total: document.getElementById('totalPages')?.textContent,
                  pagesWidth: Math.round((pages?.width || 0) * 10) / 10,
                  pagesHeight: Math.round((pages?.height || 0) * 10) / 10,
                  firstTop: Math.round((first?.top || 0) * 10) / 10,
                  firstWidth: Math.round((first?.width || 0) * 10) / 10,
                };
              });
              const before = await signature();
              await page.waitForTimeout(450);
              assert.deepEqual(await signature(), before, `${viewport.name}: settled first layout must remain stable without control interaction`);

              const toc = page.locator('#tocBtn');
              await toc.waitFor({ state: 'visible', timeout: 10000 });
              await toc.click();
              await page.locator('#tocOverlay.active').waitFor({ state: 'visible', timeout: 10000 });
              const drawerState = await page.evaluate(() => {
                const drawer = document.getElementById('tocOverlay');
                const button = document.getElementById('tocBtn');
                const app = document.querySelector('.app');
                const header = document.getElementById('readerChrome');
                const rect = drawer.getBoundingClientRect();
                const style = getComputedStyle(drawer);
                return {
                  width: rect.width, height: rect.height, display: style.display,
                  visibility: style.visibility, expanded: button.getAttribute('aria-expanded'),
                  modal: drawer.getAttribute('aria-modal'), appInert: !!app?.inert,
                  appBlockedClass: !!app?.classList.contains('gui-modal-background'),
                  headerPointerEvents: getComputedStyle(header).pointerEvents,
                };
              });
              assert.ok(drawerState.width > 20 && drawerState.height > 20, `${viewport.name}: Contents must have visible geometry`);
              assert.notEqual(drawerState.display, 'none');
              assert.notEqual(drawerState.visibility, 'hidden');
              assert.equal(drawerState.expanded, 'true');
              assert.equal(drawerState.modal, 'false');
              assert.equal(drawerState.appInert, false);
              assert.equal(drawerState.appBlockedClass, false);
              assert.notEqual(drawerState.headerPointerEvents, 'none');

              await toc.click();
              await page.waitForFunction(() => !document.getElementById('tocOverlay')?.classList.contains('active'));
              assert.equal(await toc.getAttribute('aria-expanded'), 'false');
              await toc.click();
              await page.locator('#tocOverlay.active').waitFor({ state: 'visible' });
              await page.locator('#tocClose').click();
              await page.waitForFunction(() => !document.getElementById('tocOverlay')?.classList.contains('active'));
              assert.equal(await toc.getAttribute('aria-expanded'), 'false');

              assert.deepEqual(errors, [], `${viewport.name}: no uncaught page errors expected`);
              assert.deepEqual(failed, [], `${viewport.name}: no local Reader resource requests may fail`);
              console.log(`PASS ${viewport.name}: cold direct-open layout + Contents drawer`);
              await context.close();
            }
          } finally {
            await browser.close();
          }
          EOF
          node /tmp/reader-e2e/reader-regression.mjs
