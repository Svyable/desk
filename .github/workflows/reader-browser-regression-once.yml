name: One-shot Reader browser regression

on:
  push:
    branches:
      - sync/bookself-reader-runtime-20260914

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Install browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reader-e2e
          npm install --prefix /tmp/reader-e2e playwright@1.55.0
          npx --prefix /tmp/reader-e2e playwright install --with-deps chromium
      - name: Exercise cold layout and Contents drawer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/reader-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/reader/ >/dev/null; then break; fi
            sleep 0.25
          done
          cat >/tmp/reader-e2e/reader-regression.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const base = 'http://127.0.0.1:4173/';
          const directRead = 'reader/?b=the-limit-does-not-exist-enough&c=front-matter&o=0';
          const imprintResponse = await fetch(`${base}imprint.json`);
          assert.equal(imprintResponse.ok, true, 'imprint.json must load');
          const imprint = await imprintResponse.json();
          const storageKey = `${imprint.storagePrefix || 'obb'}:reader-experience`;
          const prefs = {
            fontSize: 22,
            font: 'clear',
            fontWeight: 500,
            tracking: 0.02,
            leading: 1.8,
            measure: 'narrow',
            align: 'left',
            paragraph: 'airy',
            indent: 'none',
            mode: 'paged',
            hyphens: 'off',
          };
          const viewports = [
            { name: 'desktop', width: 1280, height: 900, mobile: false },
            { name: 'tablet', width: 820, height: 1180, mobile: true },
            { name: 'phone', width: 390, height: 844, mobile: true },
          ];

          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                hasTouch: viewport.mobile,
                isMobile: viewport.mobile,
              });
              await context.route('https://**/*', async (route) => {
                const url = new URL(route.request().url());
                if (url.hostname === 'fonts.googleapis.com') {
                  await route.fulfill({ status: 200, contentType: 'text/css', body: '' });
                  return;
                }
                if (url.hostname === 'api.github.com') {
                  await route.fulfill({ status: 200, contentType: 'application/json', body: '[]' });
                  return;
                }
                await route.abort();
              });
              await context.addInitScript(({ key, value }) => {
                localStorage.setItem(key, value);
              }, { key: storageKey, value: JSON.stringify(prefs) });

              const page = await context.newPage();
              const pageErrors = [];
              const localFailures = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));
              page.on('requestfailed', (request) => {
                if (request.url().startsWith(base)) {
                  localFailures.push(`${request.method()} ${request.url()}: ${request.failure()?.errorText || 'failed'}`);
                }
              });
              page.on('response', (response) => {
                if (response.url().startsWith(base) && response.status() >= 400) {
                  localFailures.push(`${response.status()} ${response.url()}`);
                }
              });

              await page.goto(`${base}${directRead}`, { waitUntil: 'commit', timeout: 10000 });
              try {
                await page.waitForFunction(() => document.readyState !== 'loading', null, { timeout: 90000 });
                await page.waitForFunction(() => document.body?.dataset.stage === 'read', null, { timeout: 90000 });
                await page.waitForFunction(() => Number(document.getElementById('totalPages')?.textContent || '0') > 0, null, { timeout: 30000 });
              } catch (error) {
                console.error(`${viewport.name} startup diagnostics`, await page.evaluate(() => ({
                  readyState: document.readyState,
                  stage: document.body?.dataset.stage,
                  shelfError: document.getElementById('shelfError')?.textContent || '',
                  totalPages: document.getElementById('totalPages')?.textContent || '',
                  pagesBusy: document.getElementById('pagesWrapper')?.getAttribute('aria-busy'),
                })));
                console.error('page errors', pageErrors);
                console.error('local failures', localFailures);
                throw error;
              }

              const firstPrefs = await page.evaluate(() => {
                const root = document.documentElement;
                return {
                  fontSize: root.style.getPropertyValue('--reader-font-size').trim(),
                  leading: root.style.getPropertyValue('--reader-leading').trim(),
                  weight: root.style.getPropertyValue('--reader-font-weight').trim(),
                  tracking: root.style.getPropertyValue('--reader-tracking').trim(),
                  font: root.dataset.readerFont,
                  measure: root.dataset.readerMeasure,
                  align: root.dataset.readerAlign,
                  paragraph: root.dataset.readerParagraph,
                  mode: root.dataset.readerMode,
                  hyphens: root.dataset.readerHyphens,
                };
              });
              assert.deepEqual(firstPrefs, {
                fontSize: '22px',
                leading: '1.8',
                weight: '500',
                tracking: '0.02em',
                font: 'clear',
                measure: 'narrow',
                align: 'left',
                paragraph: 'airy',
                mode: 'paged',
                hyphens: 'off',
              }, `${viewport.name}: saved Reader type/spacing must be applied before touching a control`);

              await page.evaluate(async () => {
                if (document.fonts?.ready) await document.fonts.ready;
              });
              await page.waitForTimeout(220);
              const signature = () => page.evaluate(() => {
                const pages = document.getElementById('pagesWrapper')?.getBoundingClientRect();
                const first = document.querySelector('#pagesWrapper .page-inner')?.getBoundingClientRect();
                return {
                  total: document.getElementById('totalPages')?.textContent || '',
                  pagesWidth: Math.round((pages?.width || 0) * 10) / 10,
                  pagesHeight: Math.round((pages?.height || 0) * 10) / 10,
                  firstTop: Math.round((first?.top || 0) * 10) / 10,
                  firstWidth: Math.round((first?.width || 0) * 10) / 10,
                };
              });
              const before = await signature();
              await page.waitForTimeout(450);
              assert.deepEqual(await signature(), before, `${viewport.name}: cold-open layout must remain settled before control interaction`);

              const toc = page.locator('#tocBtn');
              await toc.waitFor({ state: 'visible', timeout: 10000 });
              await toc.click();
              await page.locator('#tocOverlay.active').waitFor({ state: 'visible', timeout: 10000 });
              const drawer = await page.evaluate(() => {
                const overlay = document.getElementById('tocOverlay');
                const button = document.getElementById('tocBtn');
                const app = document.querySelector('.app');
                const header = document.getElementById('readerChrome');
                const rect = overlay.getBoundingClientRect();
                const style = getComputedStyle(overlay);
                return {
                  width: rect.width,
                  height: rect.height,
                  display: style.display,
                  visibility: style.visibility,
                  expanded: button.getAttribute('aria-expanded'),
                  modal: overlay.getAttribute('aria-modal'),
                  appInert: !!app?.inert,
                  appBlockedClass: !!app?.classList.contains('gui-modal-background'),
                  headerPointerEvents: getComputedStyle(header).pointerEvents,
                };
              });
              assert.ok(drawer.width > 20 && drawer.height > 20, `${viewport.name}: Contents drawer must be visibly laid out`);
              assert.notEqual(drawer.display, 'none', `${viewport.name}: Contents drawer must render`);
              assert.notEqual(drawer.visibility, 'hidden', `${viewport.name}: Contents drawer must be visible`);
              assert.equal(drawer.expanded, 'true', `${viewport.name}: Contents aria-expanded must be true while open`);
              assert.equal(drawer.modal, 'false', `${viewport.name}: Contents must be a navigation drawer, not a modal`);
              assert.equal(drawer.appInert, false, `${viewport.name}: Reader shell must remain interactive`);
              assert.equal(drawer.appBlockedClass, false, `${viewport.name}: Reader shell must not retain modal blocking state`);
              assert.notEqual(drawer.headerPointerEvents, 'none', `${viewport.name}: Reader header must remain interactive`);

              await toc.click();
              await page.waitForFunction(() => !document.getElementById('tocOverlay')?.classList.contains('active'));
              assert.equal(await toc.getAttribute('aria-expanded'), 'false', `${viewport.name}: Contents button must close drawer`);
              await toc.click();
              await page.locator('#tocOverlay.active').waitFor({ state: 'visible' });
              await page.locator('#tocClose').click();
              await page.waitForFunction(() => !document.getElementById('tocOverlay')?.classList.contains('active'));
              assert.equal(await toc.getAttribute('aria-expanded'), 'false', `${viewport.name}: Contents close button must close drawer`);

              assert.deepEqual(pageErrors, [], `${viewport.name}: no uncaught Reader errors expected`);
              if (localFailures.length) console.warn(`${viewport.name} optional/local request diagnostics`, localFailures);
              console.log(`PASS ${viewport.name}: cold layout + Contents drawer`);
              await context.close();
            }
          } finally {
            await browser.close();
          }
          EOF
          node /tmp/reader-e2e/reader-regression.mjs
