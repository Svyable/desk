name: Wire Desk to shared title-page Reader

on:
  push:
    branches:
      - reader-title-page-hook

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-title-page-hook
      - name: Add title-page stylesheet and refresh shared runtime cache keys
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('reader/index.html')
          text = index.read_text(encoding='utf-8')
          title_link = '  <link rel="stylesheet" href="css/title-page.css?v=r1">\n'
          if title_link not in text:
              anchor = '  <link rel="stylesheet" href="css/style.css?v=r11">\n'
              if anchor not in text:
                  raise SystemExit('Desk style.css anchor not found')
              text = text.replace(anchor, anchor + title_link, 1)
          text = text.replace('src="js/experience.js?v=r2"', 'src="js/experience.js?v=r3"', 1)
          index.write_text(text, encoding='utf-8')

          loader = Path('reader/js/app-loader.js')
          text = loader.read_text(encoding='utf-8')
          old = "const appUrl = `${upstream}app.js?v=desk-20260904-4`;"
          new = "const appUrl = `${upstream}app.js?v=desk-20260905-titlepage-1`;"
          if old not in text:
              raise SystemExit('Desk shared app cache-key anchor not found')
          loader.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate Desk bridge wiring
        run: |
          grep -F 'css/title-page.css?v=r1' reader/index.html
          grep -F 'js/experience.js?v=r3' reader/index.html
          grep -F 'desk-20260905-titlepage-1' reader/js/app-loader.js
          node --check reader/js/app-loader.js
          git diff --check
      - name: Commit Desk Reader hook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader/index.html reader/js/app-loader.js
          git commit -m "Wire Desk to canonical title-page Reader"
          git push origin HEAD:reader-title-page-hook
