name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript contract tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test; do
            echo "::group::$test"
            node --test "$test"
            echo "::endgroup::"
          done < <(find desk reader -name '*.test.mjs' -print | sort)
      - name: Python contract tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test; do
            echo "::group::$test"
            python3 "$test"
            echo "::endgroup::"
          done < <(find scripts tests -name '*.test.py' -print | sort)
