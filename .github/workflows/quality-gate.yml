name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every repository contract
        shell: bash
        run: |
          set -uo pipefail
          status=0

          while IFS= read -r test; do
            echo "::group::$test"
            node --test "$test" || status=1
            echo "::endgroup::"
          done < <(find desk reader -name '*.test.mjs' -print | sort)

          while IFS= read -r test; do
            echo "::group::$test"
            python3 "$test" || status=1
            echo "::endgroup::"
          done < <(find scripts tests -name '*.test.py' -print | sort)

          exit "$status"
