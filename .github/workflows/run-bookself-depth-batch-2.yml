name: Run Bookself depth batch 2

on:
  push:
    branches:
      - revision/bookself-depth-pass

permissions:
  contents: write

jobs:
  deepen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deepen Bookself chapters 8 through 14
        run: python3 .bookself-depth-batch-2.py
      - name: Commit manuscript changes and remove temporary runner
        run: |
          rm .bookself-depth-batch-2.py
          rm .github/workflows/run-bookself-depth-batch-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/bookself/manuscript/ch08-deadlines.md
          git add books/bookself/manuscript/ch09-the-bookself.md
          git add books/bookself/manuscript/ch10-bad-first-versions.md
          git add books/bookself/manuscript/ch11-private-starts.md
          git add books/bookself/manuscript/ch12-borrowed-rooms.md
          git add books/bookself/manuscript/ch13-small-wins.md
          git add books/bookself/manuscript/ch14-the-unfinished-mind.md
          git add .bookself-depth-batch-2.py .github/workflows/run-bookself-depth-batch-2.yml
          git commit -m "Deepen Bookself chapters 8-14"
          git push
