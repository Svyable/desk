name: Publish Binder Reader

on:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - 'README.md'
      - 'imprint.json'
      - '.github/workflows/public-reader.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: binder-reader-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Binder
        uses: actions/checkout@v6

      - name: Checkout Bookself Reader
        uses: actions/checkout@v6
        with:
          repository: Svyable/bookself
          path: _bookself
          persist-credentials: false

      - name: Build public reader artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Shared Reader UI comes from the canonical Bookself platform.
          cp -R _bookself/reader _site/reader

          # The Reader needs the Binder identity and catalog.
          cp README.md imprint.json _site/
          touch _site/.nojekyll

          # Publish only reader-facing book files. Keep research, scripts,
          # agent instructions, release tooling, and other Binder internals private.
          for book in books/*; do
            [ -d "$book" ] || continue
            slug="$(basename "$book")"
            case "$slug" in
              _*) continue ;;
            esac

            out="_site/books/$slug"
            mkdir -p "$out"

            [ ! -f "$book/README.md" ] || cp "$book/README.md" "$out/README.md"
            [ ! -f "$book/reader.json" ] || cp "$book/reader.json" "$out/reader.json"
            [ ! -d "$book/manuscript" ] || cp -R "$book/manuscript" "$out/manuscript"
            [ ! -d "$book/media" ] || cp -R "$book/media" "$out/media"
          done

      - name: Show Binder drafts in the Reader catalog
        shell: python
        run: |
          from pathlib import Path

          path = Path('_site/reader/js/app.js')
          text = path.read_text(encoding='utf-8')
          old = 'if (meta.published) entries.push(meta);'
          new = "if (meta.published || window.__IMPRINT?.role === 'binder') entries.push(meta);"
          if old not in text:
              raise SystemExit('Bookself Reader catalog hook changed; update Binder preview patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
