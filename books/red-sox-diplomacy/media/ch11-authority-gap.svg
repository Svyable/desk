<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Authority gap at the North Atlantic Council on the night of September 11, 2001</title>
  <desc id="desc">A documentary progression distinguishing allied solidarity, ambassadorial answers, capital instructions, and the still-pending formal Article 5 decision.</desc>
  <defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e6"/><stop offset="1" stop-color="#e8dfd0"/></linearGradient></defs>
  <rect width="1400" height="900" fill="#161310"/>
  <rect x="56" y="48" width="1288" height="804" rx="8" fill="url(#paper)"/>
  <text x="104" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="5" fill="#6c6258">AUTHORITY GAP 01 · LATE 11 SEPTEMBER 2001</text>
  <line x1="104" y1="138" x2="1296" y2="138" stroke="#bd3039" stroke-width="3"/>
  <text x="104" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#171411">Solidarity moved faster than procedure.</text>
  <text x="104" y="238" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62594f">North Atlantic Council · nineteen ambassadors · formal treaty act still pending</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="104" y="306" width="360" height="300" rx="8" fill="#0c2340"/>
    <text x="136" y="350" font-size="18" font-weight="700" letter-spacing="2.4" fill="#f3eee3">POLITICAL INSTINCT</text>
    <text x="136" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#f3eee3">Majority:</text>
    <text x="136" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" fill="#f3eee3">unequivocal yes</text>
    <text x="136" y="500" font-size="19" fill="#d7dde4">Burns's retrospective account:</text>
    <text x="136" y="533" font-size="19" fill="#d7dde4">most ambassadors were ready</text>
    <text x="136" y="564" font-size="19" fill="#d7dde4">to support collective defense.</text>

    <rect x="520" y="306" width="360" height="300" rx="8" fill="#efe7da" stroke="#cbbfaf"/>
    <text x="552" y="350" font-size="18" font-weight="700" letter-spacing="2.4" fill="#bd3039">AUTHORIZATION</text>
    <text x="552" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2a241f">Some allies:</text>
    <text x="552" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-style="italic" fill="#2a241f">awaiting instructions</text>
    <text x="552" y="500" font-size="19" fill="#514940">Ambassadors could express intent;</text>
    <text x="552" y="533" font-size="19" fill="#514940">capitals still had to authorize</text>
    <text x="552" y="564" font-size="19" fill="#514940">their governments' positions.</text>

    <rect x="936" y="306" width="360" height="300" rx="8" fill="#efe7da" stroke="#cbbfaf"/>
    <text x="968" y="350" font-size="18" font-weight="700" letter-spacing="2.4" fill="#7a6855">NATIONAL PROCEDURE</text>
    <text x="968" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2a241f">Denmark:</text>
    <text x="968" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-style="italic" fill="#2a241f">parliamentary consultation</text>
    <text x="968" y="500" font-size="19" fill="#514940">Alliance consensus still depended</text>
    <text x="968" y="533" font-size="19" fill="#514940">on national constitutional and</text>
    <text x="968" y="564" font-size="19" fill="#514940">political processes.</text>
  </g>

  <line x1="284" y1="647" x2="1116" y2="647" stroke="#9c8e80" stroke-width="2"/>
  <circle cx="284" cy="647" r="8" fill="#0c2340"/><circle cx="700" cy="647" r="8" fill="#bd3039"/><circle cx="1116" cy="647" r="8" fill="#7a6855"/>
  <text x="284" y="684" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#514940">sympathy / intent</text>
  <text x="700" y="684" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#514940">capital instruction</text>
  <text x="1116" y="684" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#514940">formal NATO decision</text>

  <rect x="104" y="724" width="1192" height="78" rx="5" fill="#0c2340" opacity="0.95"/>
  <text x="132" y="756" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.1" fill="#f3eee3">STATUS AT CHAPTER END</text>
  <text x="132" y="786" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#f3eee3">Article 5 had not yet been formally invoked. The treaty decision belongs to the morning of September 12—and to Chapter 12.</text>
  <text x="1296" y="838" text-anchor="end" font-family="'Courier New', monospace" font-size="16" fill="#82776c">RSD / CH11 / NIGHT / A01</text>
</svg>
