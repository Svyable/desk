<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Roger Clemens briefing-room social-memory circuit, 1996–1997</title>
  <desc id="desc">A documentary loop showing Nicholas Burns's joke about Roger Clemens, a reporter callback, a CBS producer's intervention, and the signed Toronto photograph sent back to Burns.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e6"/><stop offset="1" stop-color="#e8dfd0"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8a7968"/></marker>
  </defs>
  <rect width="1400" height="860" fill="#101722"/>
  <rect x="58" y="50" width="1284" height="760" rx="8" fill="url(#paper)"/>
  <text x="106" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="5" fill="#6c6258">CIRCUIT OBJECT 01 · SOCIAL MEMORY</text>
  <line x1="106" y1="142" x2="1294" y2="142" stroke="#bd3039" stroke-width="3"/>
  <text x="106" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="41" fill="#171411">A joke leaves the podium and comes back signed.</text>
  <text x="106" y="244" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62594f">Roger Clemens / Boston → Toronto · December 1996–October 1997</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="112" y="326" width="250" height="185" rx="8" fill="#efe7da" stroke="#c9bcac"/>
    <text x="136" y="365" font-size="17" font-weight="700" letter-spacing="2.2" fill="#bd3039">1 · BURNS</text>
    <text x="136" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#201b17">Podium grievance</text>
    <text x="136" y="444" font-size="18" fill="#514940">Clemens leaves Boston.</text>
    <text x="136" y="475" font-size="18" fill="#514940">Burns theatrically calls it</text>
    <text x="136" y="502" font-size="18" font-style="italic" fill="#514940">“treason.”</text>

    <rect x="435" y="326" width="250" height="185" rx="8" fill="#efe7da" stroke="#c9bcac"/>
    <text x="459" y="365" font-size="17" font-weight="700" letter-spacing="2.2" fill="#0c2340">2 · REPORTER</text>
    <text x="459" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#201b17">Callback</text>
    <text x="459" y="444" font-size="18" fill="#514940">During an unrelated policy</text>
    <text x="459" y="475" font-size="18" fill="#514940">exchange, a reporter invokes</text>
    <text x="459" y="502" font-size="18" fill="#514940">Burns's own Clemens language.</text>

    <rect x="758" y="326" width="250" height="185" rx="8" fill="#efe7da" stroke="#c9bcac"/>
    <text x="782" y="365" font-size="17" font-weight="700" letter-spacing="2.2" fill="#7a6855">3 · WOLFSON</text>
    <text x="782" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#201b17">Bridge to baseball</text>
    <text x="782" y="444" font-size="18" fill="#514940">CBS State producer Charles</text>
    <text x="782" y="475" font-size="18" fill="#514940">Wolfson arranges a Toronto</text>
    <text x="782" y="502" font-size="18" fill="#514940">Clemens photograph.</text>

    <rect x="1081" y="326" width="205" height="185" rx="8" fill="#efe7da" stroke="#c9bcac"/>
    <text x="1105" y="365" font-size="17" font-weight="700" letter-spacing="2.2" fill="#bd3039">4 · CLEMENS</text>
    <text x="1105" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#201b17">Return</text>
    <text x="1105" y="444" font-size="18" fill="#514940">The signed 8×10 wishes</text>
    <text x="1105" y="475" font-size="18" fill="#514940">Burns well in Greece and</text>
    <text x="1105" y="502" font-size="18" fill="#514940">thanks him for the remarks.</text>
  </g>

  <line x1="363" y1="419" x2="425" y2="419" stroke="#8a7968" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="686" y1="419" x2="748" y2="419" stroke="#8a7968" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1009" y1="419" x2="1071" y2="419" stroke="#8a7968" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1182 520 C1182 645 250 645 250 520" fill="none" stroke="#bd3039" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

  <text x="700" y="594" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic" fill="#342e28">The strongest evidence is not that Burns repeated the persona.</text>
  <text x="700" y="632" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic" fill="#342e28">Other people remembered it well enough to keep the circuit moving.</text>

  <rect x="106" y="680" width="1188" height="70" rx="4" fill="#ece3d5" stroke="#cbbfaf"/>
  <text x="130" y="710" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.2" fill="#0c2340">EVIDENTIARY LIMIT</text>
  <text x="130" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5d544b">The signed photograph itself is not reproduced here; this object traces the documented chain reported in contemporaneous sources.</text>

  <text x="1294" y="785" text-anchor="end" font-family="'Courier New', monospace" font-size="16" fill="#82776c">RSD / CH08 / 1996–1997 / C01</text>
</svg>
