<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">06:16 archival time object</title>
  <desc id="desc">A documentary design object built around Nicholas Burns's remembered 6:16 a.m. Brussels time for the end of the 2003 American League Championship Series Game 7.</desc>
  <defs>
    <radialGradient id="dark" cx="48%" cy="40%" r="78%">
      <stop offset="0" stop-color="#18314f"/>
      <stop offset="1" stop-color="#08111c"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="820" fill="url(#dark)"/>
  <line x1="84" y1="98" x2="1316" y2="98" stroke="#bd3039" stroke-width="3"/>
  <text x="84" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="5" fill="#d8d0c5">TIME OBJECT 01 · BRUSSELS</text>

  <text x="700" y="415" text-anchor="middle" font-family="'Courier New', ui-monospace, monospace" font-size="210" font-weight="700" letter-spacing="-12" fill="#f4efe5">06:16</text>
  <text x="700" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="9" fill="#bd3039">A.M.</text>

  <text x="700" y="575" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#e6dfd4">The archive gives us the clock.</text>
  <text x="700" y="617" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#e6dfd4">It does not give us the room.</text>

  <line x1="84" y1="686" x2="1316" y2="686" stroke="#6d7884" stroke-width="1"/>
  <text x="84" y="733" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.4" fill="#d5cabc">DOCUMENTED</text>
  <text x="84" y="769" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#b7c0c9">Burns watched 2003 ALCS Game 7 on Armed Forces TV and later supplied this exact local time.</text>
  <text x="1316" y="733" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.4" fill="#d5cabc">NOT DOCUMENTED</text>
  <text x="1316" y="769" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#b7c0c9">His words, physical reaction, who else was present, or where he watched the 2004 clincher.</text>
</svg>
