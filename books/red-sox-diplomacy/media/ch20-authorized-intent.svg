<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Authorized intent as the scarce layer in modern diplomatic communication</title>
  <desc id="desc">An editorial diagram showing abundant modern communication narrowing through four questions: authenticity, authorization, intended meaning, and accountability tomorrow.</desc>
  <defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e6"/><stop offset="1" stop-color="#e8dfd0"/></linearGradient></defs>
  <rect width="1400" height="920" fill="#101722"/>
  <rect x="56" y="48" width="1288" height="824" rx="8" fill="url(#paper)"/>
  <text x="104" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="5" fill="#6c6258">AUTHORIZED INTENT 01 · THE SCARCE LAYER</text>
  <line x1="104" y1="138" x2="1296" y2="138" stroke="#bd3039" stroke-width="3"/>
  <text x="104" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#171411">Language is abundant. Meaning still needs an owner.</text>

  <rect x="104" y="264" width="1192" height="102" rx="7" fill="#ece3d5" stroke="#cbbfaf"/>
  <text x="132" y="301" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.2" fill="#7a6855">MODERN COMMUNICATION ABUNDANCE</text>
  <text x="132" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#4b433b">translation · retrieval · video · social media · intelligence · simulation · drafting · AI-generated text</text>

  <line x1="700" y1="366" x2="700" y2="420" stroke="#7a6855" stroke-width="3"/>
  <polygon points="700,436 689,414 711,414" fill="#7a6855"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="104" y="456" width="270" height="150" rx="7" fill="#0c2340"/>
    <text x="239" y="497" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#f3eee3">1 · AUTHENTIC?</text>
    <text x="239" y="543" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3eee3">Did this message</text>
    <text x="239" y="574" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3eee3">actually come from them?</text>

    <rect x="398" y="456" width="270" height="150" rx="7" fill="#0c2340"/>
    <text x="533" y="497" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#f3eee3">2 · AUTHORIZED?</text>
    <text x="533" y="543" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3eee3">Can this person speak</text>
    <text x="533" y="574" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3eee3">for the institution?</text>

    <rect x="692" y="456" width="270" height="150" rx="7" fill="#0c2340"/>
    <text x="827" y="497" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#f3eee3">3 · INTENDED?</text>
    <text x="827" y="543" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3eee3">What weight should the</text>
    <text x="827" y="574" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3eee3">recipient give the words?</text>

    <rect x="986" y="456" width="310" height="150" rx="7" fill="#0c2340"/>
    <text x="1141" y="497" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#f3eee3">4 · ACCOUNTABLE?</text>
    <text x="1141" y="543" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3eee3">Who can own, correct or</text>
    <text x="1141" y="574" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f3eee3">answer for it tomorrow?</text>
  </g>

  <line x1="700" y1="606" x2="700" y2="666" stroke="#7a6855" stroke-width="3"/>
  <polygon points="700,682 689,660 711,660" fill="#7a6855"/>

  <rect x="294" y="700" width="812" height="92" rx="7" fill="#bd3039"/>
  <text x="700" y="739" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.4" fill="#fff9ef">AUTHORIZED INTENT</text>
  <text x="700" y="774" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#fff9ef">The scarce question is not whether a sentence can be produced. It is who has the power to mean it.</text>

  <text x="1296" y="850" text-anchor="end" font-family="'Courier New', monospace" font-size="16" fill="#82776c">RSD / CH20 / INTENT / A01</text>
</svg>
