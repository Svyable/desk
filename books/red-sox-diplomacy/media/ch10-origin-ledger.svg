<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Greek baseball multiple-beginnings ledger, 1997–2004</title>
  <desc id="desc">A chronology showing distinct grassroots, diplomatic, professional-baseball, competitive, and Olympic beginnings rather than assigning one founder to Greek baseball.</desc>
  <defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e6"/><stop offset="1" stop-color="#e8dfd0"/></linearGradient></defs>
  <rect width="1400" height="920" fill="#101722"/>
  <rect x="56" y="48" width="1288" height="824" rx="8" fill="url(#paper)"/>
  <text x="104" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="5" fill="#6c6258">ORIGIN LEDGER 01 · GREEK BASEBALL</text>
  <line x1="104" y1="138" x2="1296" y2="138" stroke="#bd3039" stroke-width="3"/>
  <text x="104" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#171411">Projects like this can begin more than once.</text>
  <text x="104" y="238" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62594f">Documented entry points · 1997–2004</text>

  <line x1="214" y1="302" x2="214" y2="758" stroke="#0c2340" stroke-width="3" opacity="0.6"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="214" cy="326" r="10" fill="#7a6855"/><text x="252" y="318" font-size="18" font-weight="700" letter-spacing="2" fill="#7a6855">1997 · GRASSROOTS</text><text x="252" y="349" font-size="20" fill="#423b34">Chuck Samiotes teaches relatives in Greece with a tennis ball and his grandmother's cane.</text>
    <circle cx="214" cy="414" r="10" fill="#bd3039"/><text x="252" y="406" font-size="18" font-weight="700" letter-spacing="2" fill="#bd3039">1998 · DIPLOMATIC ASK</text><text x="252" y="437" font-size="20" fill="#423b34">Burns later dates Greek officials' request for American baseball help to 1998.</text>
    <circle cx="214" cy="502" r="10" fill="#0c2340"/><text x="252" y="494" font-size="18" font-weight="700" letter-spacing="2" fill="#0c2340">1999 · INSTITUTIONAL NETWORK</text><text x="252" y="525" font-size="20" fill="#423b34">Angelos meets Greek officials at a Burns/federation reception; MLB and Red Sox support is reported.</text>
    <circle cx="214" cy="590" r="10" fill="#5e6b62"/><text x="252" y="582" font-size="18" font-weight="700" letter-spacing="2" fill="#5e6b62">2003 · COMPETITIVE PROOF</text><text x="252" y="613" font-size="20" fill="#423b34">The national team takes European silver and secures an Olympic berth.</text>
    <circle cx="214" cy="678" r="10" fill="#9a754f"/><text x="252" y="670" font-size="18" font-weight="700" letter-spacing="2" fill="#9a754f">2004 · OLYMPIC ARRIVAL</text><text x="252" y="701" font-size="20" fill="#423b34">A Greek national baseball team takes the field in Athens; the roster exposes the diaspora tradeoff.</text>
  </g>

  <rect x="104" y="774" width="1192" height="54" rx="4" fill="#ece3d5" stroke="#cbbfaf"/>
  <text x="132" y="808" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#4b433b">The ledger rejects a ceremonial founding date. Greek baseball had local, diaspora, diplomatic, institutional and competitive beginnings.</text>
  <text x="1296" y="856" text-anchor="end" font-family="'Courier New', monospace" font-size="16" fill="#82776c">RSD / CH10 / 1997–2004 / O01</text>
</svg>
