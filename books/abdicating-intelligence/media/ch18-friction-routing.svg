<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Put friction where the consequence changes</title>
  <desc id="desc">A conceptual routing diagram shows a task entering an AI system and being routed by purpose and stakes. Low-stakes reversible work proceeds with little interruption; learning work pauses for prediction, retrieval, or explanation; consequential or irreversible work pauses for authorization, independent evidence, or a second party. A note warns that repeating friction everywhere creates habituation and weakens the signal.</desc>
  <rect width="1200" height="720" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="70" y="72" font-size="38" font-weight="700">Put friction where the consequence changes</text>
    <text x="70" y="112" font-size="21">Conceptual routing: interruption should follow purpose and stakes, not appear everywhere.</text>

    <rect x="70" y="175" width="235" height="105" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="188" y="215" font-size="24" text-anchor="middle" font-weight="700">Task arrives</text>
    <text x="188" y="250" font-size="18" text-anchor="middle">What is the user trying to do?</text>

    <line x1="305" y1="228" x2="410" y2="228" stroke="#111" stroke-width="3"/>
    <polygon points="410,228 394,219 394,237" fill="#111"/>

    <rect x="410" y="155" width="300" height="145" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="560" y="197" font-size="24" text-anchor="middle" font-weight="700">Route by purpose + stakes</text>
    <text x="560" y="230" font-size="18" text-anchor="middle">Reversible or consequential?</text>
    <text x="560" y="258" font-size="18" text-anchor="middle">Completion or learning?</text>
    <text x="560" y="286" font-size="18" text-anchor="middle">Does the user still own the decision?</text>

    <line x1="710" y1="205" x2="825" y2="205" stroke="#111" stroke-width="3"/>
    <line x1="710" y1="228" x2="790" y2="390" stroke="#111" stroke-width="3"/>
    <line x1="710" y1="250" x2="825" y2="555" stroke="#111" stroke-width="3"/>

    <rect x="825" y="145" width="305" height="125" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="978" y="181" font-size="23" text-anchor="middle" font-weight="700">Low-stakes + reversible</text>
    <text x="978" y="214" font-size="18" text-anchor="middle">Remove friction.</text>
    <text x="978" y="241" font-size="17" text-anchor="middle">Draft, calculate, sort, suggest.</text>

    <rect x="790" y="330" width="340" height="145" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="960" y="366" font-size="23" text-anchor="middle" font-weight="700">Learning objective</text>
    <text x="960" y="399" font-size="18" text-anchor="middle">Make effort informative.</text>
    <text x="960" y="428" font-size="17" text-anchor="middle">Predict • retrieve • explain • compare</text>
    <text x="960" y="454" font-size="17" text-anchor="middle">Then fade assistance and test transfer.</text>

    <rect x="825" y="520" width="305" height="145" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="978" y="556" font-size="23" text-anchor="middle" font-weight="700">Consequential boundary</text>
    <text x="978" y="589" font-size="18" text-anchor="middle">Interrupt before commitment.</text>
    <text x="978" y="618" font-size="17" text-anchor="middle">Authorize • verify • second party</text>
    <text x="978" y="644" font-size="17" text-anchor="middle">Money • rights • safety • public acts</text>

    <rect x="70" y="390" width="590" height="205" rx="18" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="95" y="430" font-size="22" font-weight="700">Signal dies when every step is a warning.</text>
    <text x="95" y="465" font-size="18">Repeated prompts become background noise.</text>
    <text x="95" y="495" font-size="18">People learn to click through, approve by reflex, or route around the control.</text>
    <text x="95" y="535" font-size="18">Good friction is selective enough that interruption still means something.</text>
    <text x="95" y="570" font-size="17" font-style="italic">Conceptual diagram; not a quantitative risk model.</text>
  </g>
</svg>
