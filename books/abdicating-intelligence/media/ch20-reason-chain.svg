<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A reason has to lead somewhere</title>
  <desc id="desc">A conceptual diagram contrasts an accountable reason chain with a dead-end explanation. In the accountable path, a consequential decision leads to a specific reason, the actual factors and evidence used, an accountable authority, a challenge or review path, and finally correction or rule change. In the dead-end path, an output leads only to a plausible explanation with no traceable factors, accountable owner, or effective appeal.</desc>
  <rect width="1200" height="760" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="70" y="72" font-size="38" font-weight="700">A reason has to lead somewhere</text>
    <text x="70" y="112" font-size="21">Explanation matters when it connects an outcome to evidence, authority, challenge, and revision.</text>

    <text x="70" y="170" font-size="23" font-weight="700">Accountable reason chain</text>

    <rect x="70" y="205" width="180" height="100" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="160" y="244" font-size="21" text-anchor="middle" font-weight="700">Decision</text>
    <text x="160" y="276" font-size="17" text-anchor="middle">A consequential outcome</text>

    <line x1="250" y1="255" x2="295" y2="255" stroke="#111" stroke-width="3"/>
    <polygon points="295,255 280,246 280,264" fill="#111"/>

    <rect x="295" y="205" width="180" height="100" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="385" y="244" font-size="21" text-anchor="middle" font-weight="700">Specific reason</text>
    <text x="385" y="276" font-size="17" text-anchor="middle">Why this outcome?</text>

    <line x1="475" y1="255" x2="520" y2="255" stroke="#111" stroke-width="3"/>
    <polygon points="520,255 505,246 505,264" fill="#111"/>

    <rect x="520" y="190" width="205" height="130" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="623" y="229" font-size="21" text-anchor="middle" font-weight="700">Actual factors</text>
    <text x="623" y="260" font-size="17" text-anchor="middle">Evidence • rule • threshold</text>
    <text x="623" y="288" font-size="17" text-anchor="middle">What really affected it?</text>

    <line x1="725" y1="255" x2="770" y2="255" stroke="#111" stroke-width="3"/>
    <polygon points="770,255 755,246 755,264" fill="#111"/>

    <rect x="770" y="190" width="185" height="130" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="863" y="229" font-size="21" text-anchor="middle" font-weight="700">Authority</text>
    <text x="863" y="260" font-size="17" text-anchor="middle">Who owns the rule?</text>
    <text x="863" y="288" font-size="17" text-anchor="middle">Who can change it?</text>

    <line x1="955" y1="255" x2="1000" y2="255" stroke="#111" stroke-width="3"/>
    <polygon points="1000,255 985,246 985,264" fill="#111"/>

    <rect x="1000" y="190" width="145" height="130" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="1073" y="228" font-size="20" text-anchor="middle" font-weight="700">Challenge</text>
    <text x="1073" y="259" font-size="16" text-anchor="middle">Correct facts</text>
    <text x="1073" y="286" font-size="16" text-anchor="middle">Review outcome</text>

    <line x1="1073" y1="320" x2="1073" y2="365" stroke="#111" stroke-width="3"/>
    <polygon points="1073,365 1064,350 1082,350" fill="#111"/>
    <line x1="1073" y1="365" x2="863" y2="365" stroke="#111" stroke-width="3"/>
    <line x1="863" y1="365" x2="863" y2="335" stroke="#111" stroke-width="3"/>
    <polygon points="863,335 854,350 872,350" fill="#111"/>
    <text x="968" y="392" font-size="17" text-anchor="middle">Correction can reach the decision — or the rule itself.</text>

    <line x1="70" y1="450" x2="1130" y2="450" stroke="#111" stroke-width="2"/>

    <text x="70" y="505" font-size="23" font-weight="700">Synthetic legitimacy</text>

    <rect x="70" y="540" width="210" height="105" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="175" y="580" font-size="21" text-anchor="middle" font-weight="700">Opaque output</text>
    <text x="175" y="612" font-size="17" text-anchor="middle">A score or recommendation</text>

    <line x1="280" y1="592" x2="345" y2="592" stroke="#111" stroke-width="3"/>
    <polygon points="345,592 330,583 330,601" fill="#111"/>

    <rect x="345" y="525" width="280" height="135" rx="18" fill="none" stroke="#111" stroke-width="3"/>
    <text x="485" y="566" font-size="21" text-anchor="middle" font-weight="700">Plausible explanation</text>
    <text x="485" y="598" font-size="17" text-anchor="middle">Fluent, reassuring, perhaps useful —</text>
    <text x="485" y="626" font-size="17" text-anchor="middle">but not tied to what drove the outcome</text>

    <line x1="625" y1="592" x2="705" y2="592" stroke="#111" stroke-width="3"/>
    <line x1="705" y1="565" x2="705" y2="619" stroke="#111" stroke-width="5"/>

    <text x="755" y="565" font-size="20" font-weight="700">Dead end</text>
    <text x="755" y="599" font-size="17">No traceable factors.</text>
    <text x="755" y="627" font-size="17">No accountable owner.</text>
    <text x="755" y="655" font-size="17">No effective path to correction.</text>

    <text x="70" y="715" font-size="17" font-style="italic">Conceptual diagram; not a universal legal standard or a compliance flowchart.</text>
  </g>
</svg>
