<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cheap variation makes the filter more consequential</title>
  <desc id="desc">A four-stage feedback loop. Generation gets cheap, candidate supply expands, selection gets stricter, and producers optimize to the selector. The loop returns to generation as testing and regeneration create still more candidates. A central note states that human attention does not scale with output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="758" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700">Cheap variation makes the filter more consequential.</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Synthetic competition is a feedback loop, not just a flood of content.</text>

  <rect x="70" y="155" width="390" height="165" rx="16" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
  <text x="100" y="198" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">1 — GENERATION GETS CHEAP</text>
  <text x="100" y="238" font-family="Georgia, serif" font-size="24" font-weight="700">More candidates per idea.</text>
  <text x="100" y="272" font-family="Arial, sans-serif" font-size="18">Headlines · images · listings · clips</text>
  <text x="100" y="298" font-family="Arial, sans-serif" font-size="18">translations · summaries · messages</text>

  <rect x="740" y="155" width="390" height="165" rx="16" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
  <text x="770" y="198" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">2 — SUPPLY EXPANDS</text>
  <text x="770" y="238" font-family="Georgia, serif" font-size="24" font-weight="700">Scarce positions face more bids.</text>
  <text x="770" y="272" font-family="Arial, sans-serif" font-size="18">The feed, search page, marketplace,</text>
  <text x="770" y="298" font-family="Arial, sans-serif" font-size="18">inbox, answer, or shelf is still finite.</text>

  <rect x="740" y="470" width="390" height="165" rx="16" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
  <text x="770" y="513" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">3 — SELECTION GETS STRONGER</text>
  <text x="770" y="553" font-family="Georgia, serif" font-size="24" font-weight="700">The selector needs better evidence.</text>
  <text x="770" y="587" font-family="Arial, sans-serif" font-size="18">Ranking · spam controls · satisfaction</text>
  <text x="770" y="613" font-family="Arial, sans-serif" font-size="18">originality · reputation · provenance</text>

  <rect x="70" y="470" width="390" height="165" rx="16" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
  <text x="100" y="513" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">4 — PRODUCERS ADAPT</text>
  <text x="100" y="553" font-family="Georgia, serif" font-size="24" font-weight="700">Optimize for what survives.</text>
  <text x="100" y="587" font-family="Arial, sans-serif" font-size="18">Test · measure · rewrite · regenerate</text>
  <text x="100" y="613" font-family="Arial, sans-serif" font-size="18">Then feed the result back into production.</text>

  <path d="M460 237 H720" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M935 320 V445" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M740 552 H480" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M265 470 V345" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="600" cy="394" r="118" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="600" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="700">Human attention</text>
  <text x="600" y="402" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="700">does not scale</text>
  <text x="600" y="432" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="700">with output.</text>

  <text x="600" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-style="italic">Cheap production does not make selection less important. It makes selection more important.</text>
  <text x="600" y="731" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Conceptual diagram — not a quantitative model; exact signals and defenses vary by system.</text>
</svg>