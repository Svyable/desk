<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bookself — Books by Sven Benson</title>
  <meta name="description" content="Bookself is a living collection of books by Sven Benson — complete drafts, works in progress, and ideas becoming books.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bookself">
  <meta property="og:title" content="Bookself">
  <meta property="og:description" content="Books in the act of becoming books. Read complete drafts and works in progress by Sven Benson.">
  <meta property="og:url" content="https://svyable.github.io/desk/reader/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Bookself">
  <meta name="twitter:description" content="Books in the act of becoming books. Read complete drafts and works in progress by Sven Benson.">
  <link rel="describedby" href="../llms.txt">
</head>
<body>
  <p id="boot">Opening Bookself…</p>
  <script>
    (async () => {
      const upstream = 'https://svyable.github.io/shelf/reader/';
      try {
        const response = await fetch(upstream, { cache: 'no-cache' });
        if (!response.ok) throw new Error(`Shared Reader returned ${response.status}`);
        let html = await response.text();

        html = html.replace(/(href|src)="(?!https?:|data:|#|\/)([^"]+)"/g, (_match, attr, value) => {
          if (attr === 'src' && /^js\/app\.js(?:\?|$)/.test(value)) {
            return 'src="js/app-loader.js"';
          }
          return `${attr}="${new URL(value, upstream).href}"`;
        });

        html = html.replace(
          /src="https:\/\/svyable\.github\.io\/shelf\/reader\/js\/app\.js[^"]*"/,
          'src="js/app-loader.js"'
        );

        html = html.replace(
          '</head>',
          '  <link rel="describedby" href="../llms.txt">\n</head>'
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('boot').textContent =
          `Could not load Bookself: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
